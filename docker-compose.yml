# AegisLink — Production Docker Compose
#
# Required environment variables (set in a .env file beside this file, or injected by CI):
#   TURN_SECRET        — HMAC-SHA1 seed for coturn time-limited tokens (rotate every 24 h)
#   CORS_ORIGIN        — Allowed relay origins, e.g. https://aegislink.duckdns.org
#   FCM_SERVER_KEY     — FCM server key (wake-up push only — no message payload)
#   APNS_KEY_ID        — APNs key ID
#   APNS_TEAM_ID       — Apple Developer team ID
#   PORT               — Relay listen port (default 3001)
#   TRUST_PROXY        — Number of trusted proxy hops in front of relay (default 1)
#
# AegisLink privacy guarantees enforced at this layer:
#   - relay: access logs omit IPs (middleware in app code + log driver cap)
#   - coturn: no-cli flag + no IP logging directive in turnserver.conf
#   - log rotation capped at 10 MB × 3 files to limit disk exposure

version: '3.9'

services:
  # ── Relay (Node.js 22 + Socket.IO) ────────────────────────────────────────
  relay:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: aegislink-relay:latest
    container_name: aegislink-relay
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      # NOTE: the relay reads AEGIS_DB_PATH (see server/src/db/client.ts).
      # A previous DB_PATH name was silently ignored and fell back to ./data
      # (EACCES under the non-root container user). Keep this name in sync.
      AEGIS_DB_PATH: /data/aegislink.db
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # KLIPY_KEY enables the GIF proxy (routes/proxyGif.ts). Like the other
      # secrets it lives in /etc/aegislink.env (-> .env); the relay returns 503
      # gif_provider_not_configured when it is unset. Must be listed here or the
      # container never sees it (same gotcha as TURN_HOST).
      KLIPY_KEY: ${KLIPY_KEY:-}
      # BLOB_SECRET signs the HMAC download tokens that authorize blob fetches
      # (routes/blob.ts). The relay THROWS on startup in production when it is
      # unset (fail-closed, Ola 7 / C-1), so — like TURN_SECRET — it must be
      # listed here or the container never sees the value from .env and crashes.
      BLOB_SECRET: ${BLOB_SECRET:?BLOB_SECRET must be set in environment or .env}
      # TURN_SECRET is used server-side to sign ephemeral TURN credentials (TTL 24 h).
      # It never leaves the server and is NOT logged anywhere.
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET must be set in environment or .env}
      # TURN_HOST is the PUBLIC hostname clients must reach the coturn relay at.
      # Without it the relay's /turn endpoint falls back to 'localhost', so the
      # ICE config tells each phone to relay against ITSELF -> "Call failed".
      # TURNS_PORT stays empty until coturn's TLS listener (5349) is serving a
      # readable privkey; an empty turns: URL would break the whole RTCConfig.
      TURN_HOST: ${TURN_HOST:-aegislink.duckdns.org}
      TURN_PORT: ${TURN_PORT:-3478}
      TURNS_PORT: ${TURNS_PORT:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
    volumes:
      # Persistent SQLite database
      - relay_data:/data
      # Encrypted blob uploads — purged after 24 h by relay scheduler
      - relay_uploads:/app/uploads
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    healthcheck:
      # Use 127.0.0.1, not localhost: in Alpine localhost resolves to ::1 first
      # and the relay binds IPv4 only, so localhost yields a false "unhealthy".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3001}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        # Relay middleware strips client IPs before they reach stdout.
        max-size: "10m"
        max-file: "3"
    networks:
      - aegis_internal

  # ── coturn TURN/STUN ──────────────────────────────────────────────────────
  # host network mode is required so coturn can advertise the correct public IP
  # in ICE candidates and open arbitrary UDP ports for media relay.
  coturn:
    image: coturn/coturn:latest
    container_name: aegislink-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      # Mount the RENDERED config from the host, not the repo template.
      # deploy.sh runs envsubst into /etc/coturn/turnserver.conf so TURN_SECRET
      # and EXTERNAL_IP are expanded; the repo file keeps literal ${...}.
      - /etc/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # coturn's config references certs under /etc/letsencrypt/live/<domain>,
      # so mount the certbot tree (read-only) into the container.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: -c /etc/coturn/turnserver.conf
    logging:
      driver: "json-file"
      options:
        # turnserver.conf disables IP logging — only aggregate stats flow here
        max-size: "10m"
        max-file: "3"

volumes:
  relay_data:
    driver: local
  relay_uploads:
    driver: local

networks:
  aegis_internal:
    driver: bridge
