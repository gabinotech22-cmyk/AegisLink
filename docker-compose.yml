# AegisLink — Production Docker Compose
#
# Required environment variables (set in a .env file beside this file, or injected by CI):
#   TURN_SECRET        — HMAC-SHA1 seed for coturn time-limited tokens (rotate every 24 h)
#   CORS_ORIGIN        — Allowed relay origins, e.g. https://aegislink.duckdns.org
#   FCM_SERVER_KEY     — FCM server key (wake-up push only — no message payload)
#   APNS_KEY_ID        — APNs key ID
#   APNS_TEAM_ID       — Apple Developer team ID
#   PORT               — Relay listen port (default 3001)
#   TRUST_PROXY        — Number of trusted proxy hops in front of relay (default 1)
#
# AegisLink privacy guarantees enforced at this layer:
#   - relay: access logs omit IPs (middleware in app code + log driver cap)
#   - coturn: no-cli flag + no IP logging directive in turnserver.conf
#   - log rotation capped at 10 MB × 3 files to limit disk exposure

version: '3.9'

services:
  # ── Relay (Node.js 22 + Socket.IO) ────────────────────────────────────────
  relay:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: aegislink-relay:latest
    container_name: aegislink-relay
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      # NOTE: the relay reads AEGIS_DB_PATH (see server/src/db/client.ts).
      # A previous DB_PATH name was silently ignored and fell back to ./data
      # (EACCES under the non-root container user). Keep this name in sync.
      AEGIS_DB_PATH: /data/aegislink.db
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # KLIPY_KEY enables the GIF proxy (routes/proxyGif.ts). Like the other
      # secrets it lives in /etc/aegislink.env (-> .env); the relay returns 503
      # gif_provider_not_configured when it is unset. Must be listed here or the
      # container never sees it (same gotcha as TURN_HOST).
      KLIPY_KEY: ${KLIPY_KEY:-}
      # BLOB_SECRET signs the HMAC download tokens that authorize blob fetches
      # (routes/blob.ts). The relay THROWS on startup in production when it is
      # unset (fail-closed, Ola 7 / C-1), so — like TURN_SECRET — it must be
      # listed here or the container never sees the value from .env and crashes.
      BLOB_SECRET: ${BLOB_SECRET:?BLOB_SECRET must be set in environment or .env}
      # TURN_SECRET is used server-side to sign ephemeral TURN credentials (TTL 24 h).
      # It never leaves the server and is NOT logged anywhere.
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET must be set in environment or .env}
      # TURN_HOST is the PUBLIC hostname clients must reach the coturn relay at.
      # Without it the relay's /turn endpoint falls back to 'localhost', so the
      # ICE config tells each phone to relay against ITSELF -> "Call failed".
      # TURNS_PORT stays empty until coturn's TLS listener (5349) is serving a
      # readable privkey; an empty turns: URL would break the whole RTCConfig.
      TURN_HOST: ${TURN_HOST:-aegislink.duckdns.org}
      TURN_PORT: ${TURN_PORT:-3478}
      TURNS_PORT: ${TURNS_PORT:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      # PUBLIC_CHANNELS gates the /public-channels routes (routes/publicChannels.ts).
      # Default OFF: the relay returns 404 FEATURE_DISABLED until this is 'on'.
      # Same gotcha as TURN_HOST/KLIPY_KEY: it MUST be listed here or the
      # container never sees the value from .env and the flag stays off forever.
      PUBLIC_CHANNELS: ${PUBLIC_CHANNELS:-off}
      # PUSH_MAILBOX_ENABLED gates the Slice 2b ntfy wake-up publish on the
      # mailbox offline-enqueue path (relay/handler.ts -> push/ntfy.ts).
      # Default OFF. NTFY_URL must point at the co-hosted ntfy service below
      # (service name "ntfy" on aegis_internal) — same gotcha as PUBLIC_CHANNELS/
      # TURN_HOST: both MUST be listed here or the container never sees them.
      PUSH_MAILBOX_ENABLED: ${PUSH_MAILBOX_ENABLED:-off}
      NTFY_URL: ${NTFY_URL:-http://ntfy:80}
    volumes:
      # Persistent SQLite database
      - relay_data:/data
      # Encrypted blob uploads — purged after 24 h by relay scheduler
      - relay_uploads:/app/uploads
    ports:
      # Bind to loopback ONLY: nginx terminates TLS on :443 and proxies to
      # 127.0.0.1:3001 (upstream aegis_relay). Publishing on 0.0.0.0 would expose
      # the relay in CLEARTEXT on :3001, bypassing TLS + cert-pinning — a metadata
      # leak path. The network firewall is defence-in-depth; this is the fix.
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    healthcheck:
      # Use 127.0.0.1, not localhost: in Alpine localhost resolves to ::1 first
      # and the relay binds IPv4 only, so localhost yields a false "unhealthy".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3001}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        # Relay middleware strips client IPs before they reach stdout.
        max-size: "10m"
        max-file: "3"
    networks:
      - aegis_internal

  # ── Tor onion service (Fase 4 · mailbox mode) ─────────────────────────────
  # Publishes the relay as a v3 onion service so mailbox-mode clients reach it
  # over Tor (embedded client, mobile/src/net/tor.ts) without the relay ever
  # seeing their IP. Purely additive: the clearnet nginx/TLS path is untouched.
  # The onion identity key persists in tor_keys — losing that volume ROTATES
  # the .onion address (and EXPO_PUBLIC_ONION_URL in every client build), so
  # back it up alongside the relay DB.
  tor:
    build:
      context: ./infra/tor
      dockerfile: Dockerfile
    image: aegislink-tor:latest
    container_name: aegislink-tor
    restart: unless-stopped
    depends_on:
      - relay
    volumes:
      - tor_keys:/var/lib/tor
    # No published ports: the onion service is reachable only through the Tor
    # network, and this container only dials OUT (to relay:3001 and Tor).
    networks:
      - aegis_internal
    logging:
      driver: "json-file"
      options:
        # torrc pins Log to notice — no per-connection data reaches stdout.
        max-size: "10m"
        max-file: "3"

  # ── ntfy (Fase 4 · Slice 2b — mailbox wake-up push) ───────────────────────
  # Co-hosted with the relay (docs/FASE4-SLICE2B-PUSH-DESIGN.md §5.1, §10):
  # same operator, so v1 topic = mailboxId adds no new correlation beyond what
  # the relay already routes on. The relay publishes an EMPTY, high-priority
  # message to topic=<mailboxId> when it enqueues an offline envelope:mb
  # (push/ntfy.ts); no aegisId, no sender, no content ever reaches ntfy.
  # No published ports here: reachable only via the relay (server -> publish,
  # loopback) and, for client subscribe, via the Tor hidden service below
  # (infra/tor/torrc virtual port 8090). Zero-metadata: cache/log level kept
  # minimal — no per-connection/IP logging, short cache TTL, warn-only logs.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: aegislink-ntfy
    restart: unless-stopped
    command: serve
    environment:
      # Public HTTPS base URL (Slice 2b.3): UnifiedPush endpoint URLs that ntfy
      # hands to distributors embed this value, so it must be the clearnet URL
      # nginx serves on :8443 — NOT the internal container name.
      NTFY_BASE_URL: https://aegislink.duckdns.org:8443
      # We ARE behind nginx now, but we deliberately do NOT forward client IPs
      # (privacy: zero metadata). behind-proxy stays false so ntfy never trusts
      # an X-Forwarded-For header; every clearnet visitor is keyed on nginx's
      # loopback IP. That collapses per-IP rate limits onto one shared visitor,
      # so raise the visitor limits enough for a fleet of wake subscriptions.
      NTFY_BEHIND_PROXY: "false"
      NTFY_VISITOR_SUBSCRIPTION_LIMIT: "5000"
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "500"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: "1s"
      # Keep at rest minimal: messages are wake-up pings, not history a client
      # needs to replay — the queued ciphertext lives in the relay's own DB.
      NTFY_CACHE_DURATION: "12h"
      # warn-only: no per-publish/subscribe access logging.
      NTFY_LOG_LEVEL: warn
    # Loopback-only publish port for nginx (clearnet HTTPS :8443 -> here).
    # Same pattern as the relay's 3001: never published on 0.0.0.0 — TLS
    # termination and the no-IP-logging policy both live in nginx. Tor
    # subscribe path (onion virtual port 8090 -> ntfy:80) is unchanged.
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - aegis_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── coturn TURN/STUN ──────────────────────────────────────────────────────
  # host network mode is required so coturn can advertise the correct public IP
  # in ICE candidates and open arbitrary UDP ports for media relay.
  coturn:
    image: coturn/coturn:latest
    container_name: aegislink-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      # Mount the RENDERED config from the host, not the repo template.
      # deploy.sh runs envsubst into /etc/coturn/turnserver.conf so TURN_SECRET
      # and EXTERNAL_IP are expanded; the repo file keeps literal ${...}.
      - /etc/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # coturn's config references certs under /etc/letsencrypt/live/<domain>,
      # so mount the certbot tree (read-only) into the container.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: -c /etc/coturn/turnserver.conf
    logging:
      driver: "json-file"
      options:
        # turnserver.conf disables IP logging — only aggregate stats flow here
        max-size: "10m"
        max-file: "3"

volumes:
  relay_data:
    driver: local
  relay_uploads:
    driver: local
  # Onion identity key (v3 ed25519). Backup-critical: see docs/RELAY-ONION-SERVICE.md
  tor_keys:
    driver: local

networks:
  aegis_internal:
    driver: bridge
