# ─────────────────────────────────────────────────────────────────────────────
# Smoke test — the bulletproof baseline.
#
# Proves the compiled app boots on a real Android system (emulator) and renders
# the onboarding welcome screen. No network, no relay, no camera required, so
# this flow should ALWAYS be green; if it goes red, the native build itself is
# broken (a genuine signal worth blocking on).
#
# Asserts on English copy because a fresh CI emulator defaults to en_US locale.
#
# Cold-start note: App.tsx shows a bare ActivityIndicator splash while it
# hydrates the identity store from SecureStore and warms up SQLite
# (warmUpDb/dbReadyPromise) BEFORE the Onboarding welcome screen renders.
# On a debug build on a fresh emulator this hydration can take well over the
# default Maestro timeout, so the first assertion must use a generous
# extendedWaitUntil instead of an immediate assertVisible.
# ─────────────────────────────────────────────────────────────────────────────
appId: com.aegislink.app
---
- launchApp:
    # Wipe app data so we always land on onboarding, never a leftover identity.
    clearState: true
- extendedWaitUntil:
    visible: "Generate my identity"
    timeout: 60000
- assertVisible: "Messaging without a trace."
- takeScreenshot: 01-welcome
