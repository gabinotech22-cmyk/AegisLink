# CodeQL configuration — AegisLink
#
# Scope analysis to SHIPPED application code. Generated artifacts (jest
# coverage / lcov-report), design prototypes and scratch dumps are not part of
# the product and only produce noise on the code-scanning gate.
name: AegisLink CodeQL config

# security-extended = security queries only (no maintainability/style noise);
# lint stays with tsc/eslint.
queries:
  - uses: security-extended

paths-ignore:
  - '**/coverage/**'
  - '**/lcov-report/**'
  - 'prototype/**'
  - '_scratch/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/out/**'
  # Tests are not shipped: regex/anchor findings in assertion fixtures are noise,
  # not runtime vulnerabilities.
  - '**/__tests__/**'
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.spec.ts'
  # Dev/ops tooling, not the shipped app: one-off publish scripts, TURN cred
  # rotation, deploy helpers. (The legacy `// lgtm[...]` suppressions here no
  # longer work since lgtm.com was retired.)
  - 'scripts/**'
  - 'infra/**'
  # Expo config plugins run only at prebuild (build-time), never in the shipped
  # bundle; a build-time TOCTOU is out of the runtime threat model.
  - 'mobile/plugins/**'
  - '**/*.plugin.js'
