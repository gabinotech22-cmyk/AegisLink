# CI/CD Pipeline — AegisLink
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN           — EAS personal access token (expo.dev → Account Settings → Access Tokens)
#   DEPLOY_HOST          — IP pública de la instancia AWS EC2 (e.g. 51.20.60.155)
#   DEPLOY_USER          — Usuario SSH (e.g. "ubuntu")
#   DEPLOY_SSH_KEY       — Clave privada SSH completa (contenido de ~/.ssh/id_ed25519)
#   DEPLOY_PATH          — Directorio de la app en la VM (e.g. /home/aegis/app)
#
# Optional / EAS Submit secrets (only needed for store submissions):
#   APPLE_ID             — Apple ID email for App Store Connect
#   ASC_APP_ID           — App Store Connect numeric app ID
#
# Infraestructura: el relay Node.js y coturn ya corren en la instancia AWS EC2 via PM2.
# El deploy hace pm2 reload (zero-downtime) — no usa Docker.
# Docker/docker-compose en server/Dockerfile es referencia, no se usa en prod.
#
# NOTE: Never add user data, real IPs, or encryption keys to these secrets.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      restart_coturn:
        description: 'Restart coturn on the VM after deploy'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Server — lint + typecheck ────────────────────────────────────────────
  server-typecheck:
    name: Server TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests --testPathIgnorePatterns="auth.test|prekeys.test|ratelimit.test|web3DeviceRevoke.test"

  # ─── Mobile — typecheck ───────────────────────────────────────────────────
  mobile-typecheck:
    name: Mobile TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

  mobile-test:
    name: Mobile tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ─── Permissions audit — Android + iOS native manifests ─────────────────
  permissions-audit:
    name: Permissions audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect native directories
        id: check_native
        run: |
          if [ -f "mobile/android/app/src/main/AndroidManifest.xml" ]; then
            echo "has_android=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_android=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "mobile/ios/AegisLink/Info.plist" ] || \
             compgen -G "mobile/ios/*.xcodeproj" > /dev/null 2>&1; then
            echo "has_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ios=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Android ──────────────────────────────────────────────────────────────
      - name: Audit AndroidManifest.xml permissions
        if: steps.check_native.outputs.has_android == 'true'
        run: |
          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          ALLOWED="CAMERA RECORD_AUDIO POST_NOTIFICATIONS INTERNET ACCESS_NETWORK_STATE VIBRATE RECEIVE_BOOT_COMPLETED WAKE_LOCK"

          # Extract every android.permission.* value declared in the manifest
          FOUND=$(grep -oP '(?<=android\.permission\.)\w+' "$MANIFEST" | sort -u)

          FAILED=0
          for PERM in $FOUND; do
            OK=0
            for A in $ALLOWED; do
              [ "$PERM" = "$A" ] && OK=1 && break
            done
            if [ "$OK" -eq 0 ]; then
              echo "::error file=$MANIFEST::Unauthorized permission: android.permission.$PERM"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "Audit FAILED — one or more unauthorized Android permissions found."
            exit 1
          fi
          echo "Android permissions audit PASSED. Declared: $(echo $FOUND | tr '\n' ' ')"

      - name: Android audit skipped (no native dir)
        if: steps.check_native.outputs.has_android != 'true'
        run: echo "mobile/android not present — skipping Android permissions audit."

      # ── iOS ───────────────────────────────────────────────────────────────────
      - name: Audit Info.plist privacy keys
        if: steps.check_native.outputs.has_ios == 'true'
        run: |
          # Locate the first Info.plist inside mobile/ios/
          PLIST=$(find mobile/ios -name "Info.plist" | head -1)
          if [ -z "$PLIST" ]; then
            echo "::warning::has_ios detected but no Info.plist found — skipping."
            exit 0
          fi

          # Blocked privacy keys (location, contacts, etc.)
          BLOCKED="NSLocationUsageDescription NSLocationWhenInUseUsageDescription \
                   NSLocationAlwaysUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription \
                   NSContactsUsageDescription NSPhotoLibraryUsageDescription \
                   NSPhotoLibraryAddUsageDescription NSMotionUsageDescription \
                   NSHealthShareUsageDescription NSHealthUpdateUsageDescription \
                   NSBluetoothAlwaysUsageDescription NSBluetoothPeripheralUsageDescription \
                   NFCReaderUsageDescription NSSpeechRecognitionUsageDescription \
                   NSFaceIDUsageDescription"

          FAILED=0
          for KEY in $BLOCKED; do
            if grep -q "<key>$KEY</key>" "$PLIST"; then
              echo "::error file=$PLIST::Unauthorized privacy key in Info.plist: $KEY"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "Audit FAILED — one or more unauthorized privacy keys found in $PLIST."
            exit 1
          fi
          echo "iOS Info.plist privacy audit PASSED ($PLIST)."

      - name: iOS audit skipped (no native dir)
        if: steps.check_native.outputs.has_ios != 'true'
        run: echo "mobile/ios not present — skipping iOS permissions audit."

  # ─── EAS Build — preview (APK + iOS simulator) on push to main ───────────
  eas-build-preview:
    name: EAS Build — preview
    runs-on: ubuntu-latest
    needs: [server-typecheck, mobile-typecheck, permissions-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build preview (Android APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile preview \
            --platform android \
            --non-interactive \
            --no-wait

  # ─── EAS Build — production (triggered manually or on release tag) ────────
  eas-build-production:
    name: EAS Build — production
    runs-on: ubuntu-latest
    needs: [server-typecheck, mobile-typecheck, server-test, mobile-test]
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build production (iOS + Android)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile production \
            --platform all \
            --non-interactive \
            --no-wait

  # ─── Server deploy — SSH + PM2 (relay ya corre en AWS EC2) ────────────────
  deploy-server:
    name: Deploy server
    runs-on: ubuntu-latest
    needs: [server-typecheck, server-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Package server
        run: |
          cd server
          tar \
            --exclude='./node_modules' \
            --exclude='./data' \
            --exclude='./.git' \
            --exclude='./.env' \
            -czf /tmp/aegislink-server.tar.gz .

      - name: Upload archive to VM
        run: |
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              /tmp/aegislink-server.tar.gz \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/aegislink-server.tar.gz"

      - name: Deploy on VM via PM2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" << 'ENDSSH'
          set -euo pipefail
          APP_DIR="${DEPLOY_PATH:-/home/aegis/app}"

          echo "==> Extracting..."
          mkdir -p "$APP_DIR"
          tar -xzf /tmp/aegislink-server.tar.gz -C "$APP_DIR"
          cd "$APP_DIR"

          echo "==> npm install (prod only)..."
          npm install --omit=dev --silent

          echo "==> Reloading via PM2..."
          if pm2 describe aegislink-relay > /dev/null 2>&1; then
            pm2 reload aegislink-relay --update-env
          else
            pm2 start npm --name aegislink-relay -- start
          fi
          pm2 save --force
          ENDSSH

      - name: Sync nginx config and reload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Copy the canonical nginx config to the VM and reload if nginx is installed.
          # This is idempotent and skipped cleanly when nginx is absent.
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              infra/nginx/aegislink.conf \
              "$DEPLOY_USER@$DEPLOY_HOST:/tmp/aegislink-nginx.conf"

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" << 'ENDSSH'
          set -euo pipefail
          if command -v nginx &>/dev/null; then
            NGINX_CONF="/etc/nginx/sites-available/aegislink"
            sudo cp /tmp/aegislink-nginx.conf "$NGINX_CONF"
            sudo ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/aegislink
            sudo nginx -t
            sudo nginx -s reload
            echo "==> nginx config updated and reloaded."
          else
            echo "==> nginx not installed — skipping config sync."
          fi
          rm -f /tmp/aegislink-nginx.conf
          ENDSSH

      - name: Restart coturn (manual dispatch only)
        if: github.event.inputs.restart_coturn == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "sudo systemctl restart coturn && sudo systemctl status coturn --no-pager"

      - name: Health check
        run: |
          sleep 5
          # Prefer HTTPS via domain if SSL is set up; fall back to direct HTTP port.
          if curl --fail --silent --max-time 10 \
              "https://aegislink.duckdns.org/health" | grep -q '"ok"'; then
            echo "Health check PASSED (HTTPS)"
          else
            curl --fail --silent --max-time 10 \
              "http://${{ secrets.DEPLOY_HOST }}:3001/health" | grep -q '"ok"'
            echo "Health check PASSED (HTTP fallback)"
          fi
