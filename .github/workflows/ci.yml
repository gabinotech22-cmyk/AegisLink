# CI Pipeline — AegisLink (tests + typecheck + EAS builds; NO deploys)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN           — EAS personal access token (expo.dev → Account Settings → Access Tokens)
#
# Optional / EAS Submit secrets (only needed for store submissions):
#   APPLE_ID             — Apple ID email for App Store Connect
#   ASC_APP_ID           — App Store Connect numeric app ID
#
# Deploys are NOT part of CI. The relay is deployed exclusively via the
# manual "Deploy relay (manual)" workflow (deploy.yml, workflow_dispatch),
# which matches the real VM layout: systemd unit `aegislink` running tsx
# from /home/ubuntu/aegislink/server. The old auto-deploy job (PM2,
# /home/aegis/app) targeted an infrastructure that no longer exists.
#
# NOTE: Never add user data, real IPs, or encryption keys to these secrets.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Nightly run gives an automatic signal on main without blocking PRs.
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: CI only reads code, builds and tests — it never
# writes to the repo. Explicit block instead of the account-wide default. See
# security audit 2026-07 (broad-permissions hardening).
permissions:
  contents: read

jobs:
  # ─── Server — lint + typecheck ────────────────────────────────────────────
  server-typecheck:
    name: Server TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24: node:sqlite is stable (Node 22 needs --experimental-sqlite)
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24: node:sqlite is stable (Node 22 needs --experimental-sqlite)
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─── Mobile — typecheck ───────────────────────────────────────────────────
  mobile-typecheck:
    name: Mobile TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

  mobile-test:
    name: Mobile tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ─── Mobile — parser fuzz campaign (untrusted-input parsers) ─────────────
  # Deterministic, native-dependency-free fuzzing of the QR/link/message-body
  # parsers (src/fuzz/). Scoped + serial, so it is fast and safe regardless of
  # the full Jest suite. A throw/hang on a fuzzed input fails the gate. The same
  # targets run coverage-guided under Jazzer.js on OSS-Fuzz (src/fuzz/README.md).
  mobile-fuzz:
    name: Mobile parser fuzz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run parser fuzz campaign
        run: npm run fuzz

  # ─── Desktop — typecheck + tests (Electron main/renderer, vitest) ─────────
  # Golden rule #11: the desktop client MUST have a CI test suite covering IPC,
  # ratchet serialization and DB encryption. The native cipher module
  # (better-sqlite3-multiple-ciphers) installs a prebuilt binary matching the
  # runner's Node ABI via `npm ci`, so the SQLCipher tests run the real cipher.
  desktop-typecheck:
    name: Desktop TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

  desktop-test:
    name: Desktop tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─── Mobile — E2E (Maestro on a real Android emulator) ───────────────────
  # Builds a debug APK, boots a headless Android emulator, installs the app
  # and runs the Maestro flows in mobile/.maestro/. Runs on pull_request,
  # workflow_dispatch and a nightly schedule for automatic signal, but is
  # marked `continue-on-error` so flakiness while we stabilise the native
  # build does NOT block merges — it is informational, not a hard gate.
  # Screenshots + a JUnit report are uploaded as an artifact on every run
  # (pass or fail).
  #
  # Why a local Gradle build and not EAS: the repo is public, so GitHub Actions
  # minutes are free, and a local build consumes zero EAS credits.
  mobile-e2e:
    name: Mobile E2E (Maestro)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      # The hosted runner ships with ~14 GB free; debug APK build + emulator
      # system image no longer fit ("No space left on device" while sdkmanager
      # installs the x86_64 image — recurring since 2026-07-02). Drop the big
      # preinstalled toolchains we never use here (keep Android SDK + Java).
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/share/swift \
            /opt/az /usr/local/lib/node_modules /opt/google/chrome \
            /usr/local/share/powershell /opt/microsoft || true
          sudo docker image prune --all --force || true
          df -h /
        working-directory: /

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle DEPENDENCY cache — NOT setup-java's `cache: gradle`, which requires
      # *.gradle files to exist at checkout. They don't: the native project is
      # generated later by `expo prebuild`, so `cache: gradle` errored ("No file
      # matched to **/*.gradle*") and failed the whole job at JDK setup. A plain
      # actions/cache keyed on the npm lockfile warms ~/.gradle/caches and
      # ~/.gradle/wrapper without that precondition — avoiding re-resolving deps
      # (incl. org.jitsi:webrtc) from jitpack/Maven once warm. Mirrors
      # .github/workflows/reproducible-build.yml.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-

      - name: Install mobile dependencies
        run: npm ci

      # app.json references certs/certificate.pem (gitignored, so absent in CI).
      # expo-updates code signing is not enforced in debug builds, but prebuild
      # expects the file to exist — generate a throwaway self-signed cert.
      - name: Generate placeholder updates signing cert
        run: |
          mkdir -p certs
          if [ ! -f certs/certificate.pem ]; then
            openssl req -x509 -newkey rsa:2048 -nodes \
              -keyout certs/private-key.pem \
              -out certs/certificate.pem \
              -days 1 -subj "/CN=aegislink-ci"
          fi

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install

      # A debug APK does NOT embed the JS bundle — at runtime it pulls it from
      # Metro (10.0.2.2:8081). There is no Metro in CI, so the app white-screened
      # with "Unable to load script" and every Maestro assertion failed. Pre-bundle
      # the JS into the debug assets so the app loads offline: the debug runtime
      # falls back to assets/index.android.bundle when Metro is unreachable.
      - name: Bundle JS into debug assets (no Metro in CI)
        # EXPO_PUBLIC_E2E is inlined into the bundle (Expo exposes EXPO_PUBLIC_*
        # to the app). It disables FLAG_SECURE so Maestro can capture the screen;
        # release builds never set it, so production keeps screenshots blocked.
        #
        # EXPO_PUBLIC_SERVER_URL pins the relay to the emulator loopback, where
        # nothing is listening. This is NOT cosmetic: the bundle is built with
        # `--dev false`, so `__DEV__` is false and config.ts would otherwise
        # resolve SERVER_URL to SERVER_URL_PROD — meaning every CI run mined a
        # PoW and registered a REAL identity against the live relay, and burned
        # its 5-per-15-min registration budget from a shared runner IP.
        # The 02-onboarding flow already documents "no server in CI"; this makes
        # that true. Registration fails fast, Onboarding falls through to Home
        # exactly as the flow expects, and CI never writes to production.
        env:
          EXPO_PUBLIC_E2E: '1'
          EXPO_PUBLIC_SERVER_URL: 'http://10.0.2.2:3001'
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # Build only the emulator ABI (x86_64) to cut build time and avoid OOM.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          working-directory: mobile
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # ── Diagnostics: capture logcat in the background for crash/JS-error
            # analysis while the emulator is alive (the runner kills it after). ──
            adb logcat -c || true
            adb logcat > maestro-logcat.txt 2>&1 &
            LOGCAT_PID=$!
            set +e
            maestro test .maestro/ --format junit --output maestro-report.xml
            CODE=$?
            # Snapshot the final on-screen state + rendered UI tree so we can see
            # whether it's a splash spinner, a redbox crash, or raw i18n keys.
            adb exec-out screencap -p > maestro-screen.png 2>/dev/null || true
            adb exec-out uiautomator dump /dev/tty > maestro-uihierarchy.xml 2>/dev/null || true
            kill "$LOGCAT_PID" 2>/dev/null || true
            mkdir -p maestro-out
            cp -r "$HOME/.maestro/tests/"* maestro-out/ 2>/dev/null || true
            exit $CODE

      - name: Upload Maestro results (screenshots + report)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-e2e-results
          path: |
            mobile/maestro-report.xml
            mobile/maestro-out/**
            mobile/maestro-logcat.txt
            mobile/maestro-screen.png
            mobile/maestro-uihierarchy.xml
          if-no-files-found: ignore

  # ─── Permissions audit — Android + iOS native manifests ─────────────────
  permissions-audit:
    name: Permissions audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect native directories
        id: check_native
        run: |
          if [ -f "mobile/android/app/src/main/AndroidManifest.xml" ]; then
            echo "has_android=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_android=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "mobile/ios/AegisLink/Info.plist" ] || \
             compgen -G "mobile/ios/*.xcodeproj" > /dev/null 2>&1; then
            echo "has_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ios=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Android ──────────────────────────────────────────────────────────────
      - name: Audit AndroidManifest.xml permissions
        if: steps.check_native.outputs.has_android == 'true'
        run: |
          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          ALLOWED="CAMERA RECORD_AUDIO POST_NOTIFICATIONS INTERNET ACCESS_NETWORK_STATE VIBRATE RECEIVE_BOOT_COMPLETED WAKE_LOCK"

          # Extract every android.permission.* value declared in the manifest
          FOUND=$(grep -oP '(?<=android\.permission\.)\w+' "$MANIFEST" | sort -u)

          FAILED=0
          for PERM in $FOUND; do
            OK=0
            for A in $ALLOWED; do
              [ "$PERM" = "$A" ] && OK=1 && break
            done
            if [ "$OK" -eq 0 ]; then
              echo "::error file=$MANIFEST::Unauthorized permission: android.permission.$PERM"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "Audit FAILED — one or more unauthorized Android permissions found."
            exit 1
          fi
          echo "Android permissions audit PASSED. Declared: $(echo $FOUND | tr '\n' ' ')"

      - name: Android audit skipped (no native dir)
        if: steps.check_native.outputs.has_android != 'true'
        run: echo "mobile/android not present — skipping Android permissions audit."

      # ── iOS ───────────────────────────────────────────────────────────────────
      - name: Audit Info.plist privacy keys
        if: steps.check_native.outputs.has_ios == 'true'
        run: |
          # Locate the first Info.plist inside mobile/ios/
          PLIST=$(find mobile/ios -name "Info.plist" | head -1)
          if [ -z "$PLIST" ]; then
            echo "::warning::has_ios detected but no Info.plist found — skipping."
            exit 0
          fi

          # Blocked privacy keys (location, contacts, etc.)
          BLOCKED="NSLocationUsageDescription NSLocationWhenInUseUsageDescription \
                   NSLocationAlwaysUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription \
                   NSContactsUsageDescription NSPhotoLibraryUsageDescription \
                   NSPhotoLibraryAddUsageDescription NSMotionUsageDescription \
                   NSHealthShareUsageDescription NSHealthUpdateUsageDescription \
                   NSBluetoothAlwaysUsageDescription NSBluetoothPeripheralUsageDescription \
                   NFCReaderUsageDescription NSSpeechRecognitionUsageDescription \
                   NSFaceIDUsageDescription"

          FAILED=0
          for KEY in $BLOCKED; do
            if grep -q "<key>$KEY</key>" "$PLIST"; then
              echo "::error file=$PLIST::Unauthorized privacy key in Info.plist: $KEY"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "Audit FAILED — one or more unauthorized privacy keys found in $PLIST."
            exit 1
          fi
          echo "iOS Info.plist privacy audit PASSED ($PLIST)."

      - name: iOS audit skipped (no native dir)
        if: steps.check_native.outputs.has_ios != 'true'
        run: echo "mobile/ios not present — skipping iOS permissions audit."

  # ─── EAS Build — preview (APK + iOS simulator) on push to main ───────────
  eas-build-preview:
    name: EAS Build — preview
    runs-on: ubuntu-latest
    needs: [server-typecheck, mobile-typecheck, permissions-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Best-effort: this submits a preview build with --no-wait (fire-and-forget;
    # it never waits for or verifies the build result). Its only failure mode is
    # external — the Expo Free plan exhausts its monthly Android build quota
    # mid-month, which would otherwise turn `main` red even though nothing in the
    # repo is broken. Keep it informational so quota limits don't gate merges;
    # the real gates are the typecheck + test jobs.
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build preview (Android APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile preview \
            --platform android \
            --non-interactive \
            --no-wait

  # ─── EAS Build — production (triggered manually or on release tag) ────────
  eas-build-production:
    name: EAS Build — production
    runs-on: ubuntu-latest
    needs: [server-typecheck, mobile-typecheck, server-test, mobile-test]
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build production (iOS + Android)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile production \
            --platform all \
            --non-interactive \
            --no-wait

