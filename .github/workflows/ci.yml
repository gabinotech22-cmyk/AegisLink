# CI Pipeline — AegisLink (tests + typecheck + EAS builds; NO deploys)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN           — EAS personal access token (expo.dev → Account Settings → Access Tokens)
#
# Optional / EAS Submit secrets (only needed for store submissions):
#   APPLE_ID             — Apple ID email for App Store Connect
#   ASC_APP_ID           — App Store Connect numeric app ID
#
# Deploys are NOT part of CI. The relay is deployed exclusively via the
# manual "Deploy relay (manual)" workflow (deploy.yml, workflow_dispatch),
# which matches the real VM layout: systemd unit `aegislink` running tsx
# from /home/ubuntu/aegislink/server. The old auto-deploy job (PM2,
# /home/aegis/app) targeted an infrastructure that no longer exists.
#
# NOTE: Never add user data, real IPs, or encryption keys to these secrets.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Nightly run gives an automatic signal on main without blocking PRs.
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: CI only reads code, builds and tests — it never
# writes to the repo. Explicit block instead of the account-wide default. See
# security audit 2026-07 (broad-permissions hardening).
permissions:
  contents: read

jobs:
  # ─── Which areas did this PR touch? ───────────────────────────────────────
  # Only the E2E job uses this, and only to avoid booting an Android emulator
  # for 20+ minutes on a pull request that cannot possibly affect the app — a
  # docs or content change would otherwise burn the time AND show a red X for
  # a failure that has nothing to do with it (see PR #431: one markdown file).
  #
  # FAIL-SAFE BY CONSTRUCTION: this outputs `true` unless it positively proves
  # nothing under mobile/ changed. Any unexpected event type, a missing base
  # ref, a git error — all fall through to running the job. Silently losing
  # E2E coverage on a mobile change would be far worse than a wasted run.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the three-dot diff below needs the merge base.
          fetch-depth: 0

      - id: filter
        run: |
          set +e
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request (${{ github.event_name }}) — run everything."
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          if [ -z "$CHANGED" ]; then
            echo "Could not determine changed files — assuming mobile changed."
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$CHANGED"
          # The workflow itself counts: a change to how the E2E runs must run it.
          if echo "$CHANGED" | grep -qE '^(mobile/|\.github/workflows/ci\.yml$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Docs ↔ code sync gate ────────────────────────────────────────────────
  # Golden rule "La doc no miente" #7 (CLAUDE.md). A PR that touches product
  # code without touching any doc must say so explicitly in its body with
  # `Docs: none — <reason>` (field in the PR template). Born from the external
  # audit 2026-09-16: DEVELOPMENT.md said Node 22 while the server required 24,
  # and the auditor lost every server suite to it. Tests are excluded — a
  # test-only PR changes no behaviour a doc could describe.
  docs-sync:
    name: Docs sync gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a doc change or an explicit Docs-none declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "Changed files:"; echo "$CHANGED"

          CODE=$(echo "$CHANGED" \
            | grep -E '^(server/src/|mobile/src/|desktop/src/|\.github/workflows/)' \
            | grep -vE '(^|/)__tests__/|\.test\.[cm]?[jt]sx?$|\.spec\.[cm]?[jt]sx?$' || true)
          if [ -z "$CODE" ]; then
            echo "No product code changed - nothing to sync."
            exit 0
          fi

          DOCS=$(echo "$CHANGED" | grep -E '^(docs/|README\.md$|CLAUDE\.md$|SECURITY\.md$)' || true)
          if [ -n "$DOCS" ]; then
            echo "Docs touched alongside code:"; echo "$DOCS"
            exit 0
          fi

          # 'Docs: none — reason' (em dash or hyphen), reason non-empty.
          if printf '%s\n' "$PR_BODY" | grep -qE '^Docs:[[:space:]]*none[[:space:]]*(—|-)[[:space:]]*[^[:space:]]'; then
            echo "PR body declares 'Docs: none' with a reason - accepted."
            exit 0
          fi

          echo "::error::Product code changed but no doc was updated and the PR body has no 'Docs: none — <reason>' line."
          echo "Code changed:"; echo "$CODE"
          echo "Either update the canonical doc (map: CLAUDE.md, 'La doc no miente' #7) or add to the PR body:"
          echo "  Docs: none — <why no doc applies>"
          exit 1

  # ─── Server — lint + typecheck ────────────────────────────────────────────
  server-typecheck:
    name: Server TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24: node:sqlite is stable (Node 22 needs --experimental-sqlite)
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24: node:sqlite is stable (Node 22 needs --experimental-sqlite)
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─── Self-hosted relay compose — smoke (federation F6) ────────────────────
  # The self-hosting package must at least parse and resolve with the documented
  # .env (docs/SELF-HOSTING.md). Best-effort: no images are built here.
  selfhost-compose:
    name: Self-host compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate infra/selfhost/docker-compose.yml
        working-directory: infra/selfhost
        run: |
          cp .env.example .env
          echo "BLOB_SECRET=ci-smoke-blob-secret" >> .env
          echo "TURN_SECRET=ci-smoke-turn-secret" >> .env
          docker compose config --quiet
          # Onion-only: no service may publish a host port.
          if docker compose config | grep -E '^\s+published:'; then echo "self-host compose publishes a port" >&2; exit 1; fi
          bash -n up.sh print-onion.sh backup-onion-key.sh
          # F7: a self-hosted relay must NOT inherit the official relay's
          # single-onion (non-anonymous) mode — its location stays hidden.
          docker compose config | grep -q 'TORRC: torrc.selfhost'
          if grep -Eq '^\s*HiddenService(SingleHopMode|NonAnonymousMode)\s+1' ../tor/torrc.selfhost; then echo "torrc.selfhost must be location-hidden" >&2; exit 1; fi
          docker compose build tor
          docker run --rm --add-host relay:127.0.0.1 --add-host ntfy:127.0.0.1 aegislink-tor:selfhost tor --verify-config -f /etc/tor/torrc
          # The relay's volume mount points must be writable by its own user:
          # a root-owned /app/uploads turned every attachment upload into a 500.
          docker compose build relay
          docker run --rm aegislink-relay:selfhost sh -c 'touch /app/uploads/.w /data/.w' || { echo "relay image: /app/uploads or /data not writable by aegis" >&2; exit 1; }

  # ─── Mobile — typecheck ───────────────────────────────────────────────────
  mobile-typecheck:
    name: Mobile TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

  mobile-test:
    name: Mobile tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ─── Mobile — parser fuzz campaign (untrusted-input parsers) ─────────────
  # Deterministic, native-dependency-free fuzzing of the QR/link/message-body
  # parsers (src/fuzz/). Scoped + serial, so it is fast and safe regardless of
  # the full Jest suite. A throw/hang on a fuzzed input fails the gate. The same
  # targets run coverage-guided under Jazzer.js on OSS-Fuzz (src/fuzz/README.md).
  mobile-fuzz:
    name: Mobile parser fuzz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run parser fuzz campaign
        run: npm run fuzz

  # ─── Mobile — native libsodium core (F-1 B2) ─────────────────────────────
  # The app compiles modules/aegis-sodium (C core + vendored libsodium) into its
  # binary; Jest cannot load it. This job builds the SAME sources for the host
  # (modules/aegis-sodium/cmake/libsodium.cmake, shared with the Android build)
  # and checks them byte-for-byte against TweetNaCl/@noble on random inputs and
  # RFC vectors, plus the core's length validation and fail-closed paths — once
  # optimized, once under AddressSanitizer + UndefinedBehaviorSanitizer (the C
  # core is the memory-safety boundary between JS arrays and libsodium).
  aegis-sodium-native:
    name: Mobile native crypto core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies (TweetNaCl/@noble oracle)
        run: npm ci

      - name: Build and diff the C core (release)
        run: |
          cmake -S modules/aegis-sodium/test -B build/aegis-sodium -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build/aegis-sodium
          node modules/aegis-sodium/test/differential.mjs build/aegis-sodium/aegis_sodium_cli

      - name: Build and diff the C core (ASan + UBSan)
        env:
          AEGIS_DIFF_ITER: '50'
        run: |
          cmake -S modules/aegis-sodium/test -B build/aegis-sodium-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          ninja -C build/aegis-sodium-asan
          node modules/aegis-sodium/test/differential.mjs build/aegis-sodium-asan/aegis_sodium_cli

  # ─── Desktop — typecheck + tests (Electron main/renderer, vitest) ─────────
  # Golden rule #11: the desktop client MUST have a CI test suite covering IPC,
  # ratchet serialization and DB encryption. The native cipher module
  # (better-sqlite3-multiple-ciphers) installs a prebuilt binary matching the
  # runner's Node ABI via `npm ci`, so the SQLCipher tests run the real cipher.
  desktop-typecheck:
    name: Desktop TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npm run typecheck

  desktop-test:
    name: Desktop tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─── Mobile — E2E (Maestro on a real Android emulator) ───────────────────
  # Builds a debug APK, boots a headless Android emulator, installs the app
  # and runs the Maestro flows in mobile/.maestro/. Runs on pull_request,
  # workflow_dispatch and a nightly schedule for automatic signal, but is
  # marked `continue-on-error` so flakiness while we stabilise the native
  # build does NOT block merges — it is informational, not a hard gate.
  # Screenshots + a JUnit report are uploaded as an artifact on every run
  # (pass or fail).
  #
  # Why a local Gradle build and not EAS: the repo is public, so GitHub Actions
  # minutes are free, and a local build consumes zero EAS credits.
  mobile-e2e:
    name: Mobile E2E (Maestro)
    runs-on: ubuntu-latest
    # Skip on pull requests that touch nothing under mobile/. See the `changes`
    # job: it errs toward running, so this can only skip when it is provably
    # irrelevant. Nightly and workflow_dispatch always run.
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      # The hosted runner ships with ~14 GB free; debug APK build + emulator
      # system image no longer fit ("No space left on device" while sdkmanager
      # installs the x86_64 image — recurring since 2026-07-02). Drop the big
      # preinstalled toolchains we never use here (keep Android SDK + Java).
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/share/swift \
            /opt/az /usr/local/lib/node_modules /opt/google/chrome \
            /usr/local/share/powershell /opt/microsoft || true
          sudo docker image prune --all --force || true
          df -h /
        working-directory: /

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle DEPENDENCY cache — NOT setup-java's `cache: gradle`, which requires
      # *.gradle files to exist at checkout. They don't: the native project is
      # generated later by `expo prebuild`, so `cache: gradle` errored ("No file
      # matched to **/*.gradle*") and failed the whole job at JDK setup. A plain
      # actions/cache keyed on the npm lockfile warms ~/.gradle/caches and
      # ~/.gradle/wrapper without that precondition — avoiding re-resolving deps
      # (incl. org.jitsi:webrtc) from jitpack/Maven once warm. Mirrors
      # .github/workflows/reproducible-build.yml.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-

      - name: Install mobile dependencies
        run: npm ci

      # app.json references certs/certificate.pem (gitignored, so absent in CI).
      # expo-updates code signing is not enforced in debug builds, but prebuild
      # expects the file to exist — generate a throwaway self-signed cert.
      - name: Generate placeholder updates signing cert
        run: |
          mkdir -p certs
          if [ ! -f certs/certificate.pem ]; then
            openssl req -x509 -newkey rsa:2048 -nodes \
              -keyout certs/private-key.pem \
              -out certs/certificate.pem \
              -days 1 -subj "/CN=aegislink-ci"
          fi

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install

      # A debug APK does NOT embed the JS bundle — at runtime it pulls it from
      # Metro (10.0.2.2:8081). There is no Metro in CI, so the app white-screened
      # with "Unable to load script" and every Maestro assertion failed. Pre-bundle
      # the JS into the debug assets so the app loads offline: the debug runtime
      # falls back to assets/index.android.bundle when Metro is unreachable.
      - name: Bundle JS into debug assets (no Metro in CI)
        # EXPO_PUBLIC_E2E is inlined into the bundle (Expo exposes EXPO_PUBLIC_*
        # to the app). It disables FLAG_SECURE so Maestro can capture the screen;
        # release builds never set it, so production keeps screenshots blocked.
        #
        # EXPO_PUBLIC_SERVER_URL pins the relay to the emulator loopback, where
        # the job's own throwaway relay listens (step "Start a local relay").
        # This is NOT cosmetic: the bundle is built with `--dev false`, so
        # `__DEV__` is false and config.ts would otherwise resolve SERVER_URL to
        # SERVER_URL_PROD — meaning every CI run mined a PoW and registered a
        # REAL identity against the live relay, and burned its 5-per-15-min
        # registration budget from a shared runner IP. CI never writes to
        # production.
        env:
          EXPO_PUBLIC_E2E: '1'
          EXPO_PUBLIC_SERVER_URL: 'http://10.0.2.2:3001'
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # Build only the emulator ABI (x86_64) to cut build time and avoid OOM.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64

      # A local relay on the runner, reached from the emulator at 10.0.2.2:3001
      # (the loopback the E2E bundle is pinned to; cleartext to it is allowed by
      # the app's network_security_config). Without it registration fails, a
      # "Registration failed" alert covers onboarding and, 5 s later, the
      # network-error screen covers Home — so no flow past onboarding could run.
      # Its database lives in the runner's temp dir and dies with the job.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Start a local relay for the E2E flows
        working-directory: server
        env:
          PORT: '3001'
          AEGIS_DB_PATH: ${{ runner.temp }}/e2e-relay/aegislink.db
          TRUST_PROXY: '0'
          AEGIS_REG_RATELIMIT_MAX: '50'
        run: |
          npm ci --no-audit --no-fund
          nohup npm start > "$RUNNER_TEMP/e2e-relay.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health >/dev/null; then echo "relay up"; exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/e2e-relay.log"
          exit 1

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          working-directory: mobile
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # ── Diagnostics: capture logcat in the background for crash/JS-error
            # analysis while the emulator is alive (the runner kills it after). ──
            adb logcat -c || true
            adb logcat > maestro-logcat.txt 2>&1 &
            LOGCAT_PID=$!
            set +e
            # --debug-output writes Maestro's OWN logs (driver, hierarchy dumps,
            # per-command timings) to a path we control. Without it the run
            # relied on copying $HOME/.maestro/tests/*, which came back empty:
            # the 2026-08-09 failure uploaded neither a screenshot nor a UI tree
            # nor a driver log, so the only evidence for a 664 s hang was the
            # JUnit "Unknown error". Diagnosing a driver hang needs the driver's
            # side of the story (audit 2026-08, TEST-2).
            # ONE LINE on purpose. A `\` continuation does not survive the way
            # android-emulator-runner passes this script through: the previous
            # attempt reached Maestro as a second flow path and died with
            # "Flow path does not exist: .../mobile/\".
            # Each script line runs in its own shell and the runner stops at the first
            # failing one, so the capture lines below never ran after a red flow. On
            # failure, print the app's own errors and the on-screen texts right here,
            # in the job log (artifacts are not always reachable), then fail.
            maestro test .maestro/ --format junit --output maestro-report.xml --debug-output maestro-debug || { echo "::group::logcat (app errors)"; grep -E "AndroidRuntime|FATAL EXCEPTION|ReactNativeJS|aegis_sodium|AegisSodium" maestro-logcat.txt | tail -n 150; echo "::endgroup::"; echo "::group::on-screen texts"; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb shell cat /sdcard/ui.xml | grep -o 'text="[^"]*"' | head -n 80; echo "::endgroup::"; echo "::group::maestro log (tail)"; find maestro-debug -name 'maestro.log' -exec tail -n 120 {} \; ; echo "::endgroup::"; echo "::group::relay log (tail)"; tail -n 60 "$RUNNER_TEMP/e2e-relay.log"; echo "::endgroup::"; exit 1; }
            CODE=$?
            # Snapshot the final on-screen state + rendered UI tree so we can see
            # whether it's a splash spinner, a redbox crash, or raw i18n keys.
            # `uiautomator dump` writes to a file on the device and is then
            # pulled: the old `dump /dev/tty` form interleaves the tool's own
            # status line into the XML and silently produced nothing here.
            adb exec-out screencap -p > maestro-screen.png 2>/dev/null || true
            adb shell uiautomator dump /sdcard/maestro-uihierarchy.xml >/dev/null 2>&1 && adb pull /sdcard/maestro-uihierarchy.xml maestro-uihierarchy.xml >/dev/null 2>&1 || true
            # Say out loud what we captured, so an empty artifact is visible in
            # the log instead of being silently swallowed by `if-no-files-found`.
            ls -l maestro-screen.png maestro-uihierarchy.xml 2>&1 || true
            du -sh maestro-debug 2>&1 || true
            kill "$LOGCAT_PID" 2>/dev/null || true
            mkdir -p maestro-out
            cp -r "$HOME/.maestro/tests/"* maestro-out/ 2>/dev/null || true
            exit $CODE

      - name: Upload Maestro results (screenshots + report)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-e2e-results
          path: |
            mobile/maestro-report.xml
            mobile/maestro-out/**
            mobile/maestro-debug/**
            mobile/maestro-logcat.txt
            mobile/maestro-screen.png
            mobile/maestro-uihierarchy.xml
          if-no-files-found: ignore

  # ─── Permissions audit — on the RESOLVED Expo config ──────────────────────
  # mobile/android and mobile/ios are not tracked, so auditing a checked-in
  # manifest audited nothing: this job printed "skipped" on every run while the
  # real build shipped NSLocationAlways* and NSMotionUsageDescription with
  # Expo's generic default strings (external audit 2026-09-16 AL-11). It now
  # asks Expo for the config every plugin/autolinked module would produce
  # (`expo config --type introspect`) and gates it against an explicit
  # allowlist with a reason per permission (mobile/scripts/audit-permissions.mjs).
  permissions-audit:
    name: Permissions audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Audit resolved Android permissions + iOS privacy keys
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: node scripts/audit-permissions.mjs

  # ─── EAS Build — preview (APK + iOS simulator) on push to main ───────────
  eas-build-preview:
    name: EAS Build — preview
    runs-on: ubuntu-latest
    needs: [server-typecheck, mobile-typecheck, permissions-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Best-effort: this submits a preview build with --no-wait (fire-and-forget;
    # it never waits for or verifies the build result). Its only failure mode is
    # external — the Expo Free plan exhausts its monthly Android build quota
    # mid-month, which would otherwise turn `main` red even though nothing in the
    # repo is broken. Keep it informational so quota limits don't gate merges;
    # the real gates are the typecheck + test jobs.
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build preview (Android APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile preview \
            --platform android \
            --non-interactive \
            --no-wait

  # ─── EAS Build — production (triggered manually or on release tag) ────────
  eas-build-production:
    name: EAS Build — production
    runs-on: ubuntu-latest
    needs: [server-typecheck, mobile-typecheck, server-test, mobile-test]
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build production (iOS + Android)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile production \
            --platform all \
            --non-interactive \
            --no-wait

