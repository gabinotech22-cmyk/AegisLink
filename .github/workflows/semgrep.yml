# Semgrep — fast pattern-based SAST (secrets + security-audit + AegisLink rules)
#
# Free, no Semgrep account/token needed: we run the open-source CLI against the
# public registry packs plus our own .semgrep/aegislink-rules.yml, which encodes
# the "Reglas de Oro — Seguridad" so they cannot be silently reintroduced.
#
# Findings are uploaded as SARIF to Security → Code scanning (same tab as
# CodeQL). Runs on PRs to main, push to main, and weekly.
#
# NOTE: never add secrets, real IPs, or key material to this workflow.

name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep
        # p/secrets        — hardcoded credentials / key material
        # p/security-audit — broad security smells (injection, ssrf, etc.)
        # p/typescript     — TS-specific correctness/security
        # .semgrep/        — AegisLink golden-rule checks
        # Non-blocking exit so SARIF still uploads; findings gate via the
        # code-scanning tab. Tighten to a hard fail once the baseline is clean.
        run: |
          semgrep scan \
            --config p/secrets \
            --config p/security-audit \
            --config p/typescript \
            --config .semgrep/ \
            --sarif --output semgrep.sarif \
            --error || true

      # Semgrep keeps `// nosemgrep: <rule>` findings in the SARIF, marked
      # `suppressions: [{kind: inSource}]`, and code scanning still opens them
      # as new alerts. So a PR that only moves a reviewed, justified line (the
      # rules themselves ask for nosemgrep on e.g. dev-only fallbacks gated by
      # app.isPackaged) went red. Drop exactly those results; anything without
      # an in-source justification is uploaded unchanged.
      - name: Drop nosemgrep-justified results from the SARIF
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path = 'semgrep.sarif'
          if os.path.exists(path):
              with open(path) as f:
                  sarif = json.load(f)
              for run in sarif.get('runs', []):
                  results = run.get('results', [])
                  kept = [r for r in results
                          if not any(s.get('kind') == 'inSource' for s in r.get('suppressions', []))]
                  print(f"semgrep: {len(results) - len(kept)} nosemgrep-justified result(s) dropped, {len(kept)} kept")
                  run['results'] = kept
              with open(path, 'w') as f:
                  json.dump(sarif, f)
          PY

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
