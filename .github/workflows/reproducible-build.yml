name: Reproducible build

# Two modes:
#  - PR (path-scoped): a FAST single-ABI smoke build that proves the build config
#    + app.plugin.js determinism injection actually compile and produce an APK.
#  - Tags / manual: the FULL determinism proof — build all ABIs TWICE in a clean
#    environment and assert the two outputs are byte-for-byte identical.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'mobile/app.plugin.js'
      - 'mobile/scripts/build-reproducible.sh'
      - 'mobile/app.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/reproducible-build.yml'

permissions:
  contents: read

jobs:
  # ── Fast PR feedback: does it build + does the plugin inject? (single ABI) ───
  smoke:
    if: github.event_name == 'pull_request'
    name: Build smoke (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      # Gradle DEPENDENCY cache (not setup-java's `cache: gradle`, which needs
      # *.gradle files at checkout — they don't exist until prebuild). Speeds the
      # cold native download; content-addressed, so it can't affect output bytes.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-
      - name: Build (single ABI, unsigned release)
        working-directory: mobile
        env:
          AEGIS_REPRO_ABIS: arm64-v8a
        run: bash scripts/build-reproducible.sh --clean
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # ── Full determinism proof: all ABIs, build twice, diff byte-for-byte ────────
  determinism:
    if: github.event_name != 'pull_request'
    name: Build twice, diff byte-for-byte
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-

      - name: Build #1
        working-directory: mobile
        run: bash scripts/build-reproducible.sh --clean
      - name: Capture build #1
        working-directory: mobile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_repro"
          cp "$(find android/app/build/outputs/apk/release -name '*.apk' | sort | head -1)" \
             "$GITHUB_WORKSPACE/_repro/build1.apk"
          sha256sum "$GITHUB_WORKSPACE/_repro/build1.apk"

      # Wipe generated native output (NOT ~/.gradle deps) so build #2 recompiles
      # rather than reusing build #1's outputs — that's what makes the diff a real
      # determinism test. Gradle's build cache is off by default, so this holds.
      - name: Reset native output
        working-directory: mobile
        run: rm -rf android

      - name: Build #2
        working-directory: mobile
        run: bash scripts/build-reproducible.sh --clean
      - name: Capture build #2
        working-directory: mobile
        run: |
          cp "$(find android/app/build/outputs/apk/release -name '*.apk' | sort | head -1)" \
             "$GITHUB_WORKSPACE/_repro/build2.apk"
          sha256sum "$GITHUB_WORKSPACE/_repro/build2.apk"

      - name: Assert byte-for-byte identical
        run: |
          cd "$GITHUB_WORKSPACE/_repro"
          echo "build1: $(sha256sum build1.apk | cut -d' ' -f1)"
          echo "build2: $(sha256sum build2.apk | cut -d' ' -f1)"
          if ! cmp -s build1.apk build2.apk; then
            echo "::error::Release APK is NOT reproducible — the two builds differ."
            command -v unzip >/dev/null && {
              unzip -l build1.apk | sort > l1.txt
              unzip -l build2.apk | sort > l2.txt
              echo "--- diff of zip entry listings ---"
              diff l1.txt l2.txt || true
            }
            exit 1
          fi
          echo "✅ Reproducible: both builds are byte-for-byte identical."

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reproducible-apk
          path: _repro/*.apk
          if-no-files-found: warn
