# Test APK — on-demand installable release APK for emulator/device testing.
#
# Why this exists: local Windows release builds are currently blocked (corrupt
# NDK 27.1 sysroot + MAX_PATH 260-char limit), and the EAS cloud path is blocked
# by an EXPO_TOKEN tied to the wrong Expo account. This workflow builds a normal
# debug-signed release APK on a clean Ubuntu runner — no NDK corruption, no path
# limit, no Expo account needed — and uploads it as a downloadable artifact.
#
# The release buildType signs with the debug keystore (see android/app/build.gradle),
# so the APK is installable via `adb install` on both the x86_64 emulators and
# arm64 phones (reactNativeArchitectures = arm64-v8a,x86_64 → both ABIs bundled).
# JS is bundled at build time, so NO Metro is required to run it.
#
# Trigger: Actions tab → "Test APK" → Run workflow, or `gh workflow run test-apk.yml`.
name: Test APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (release = installable test build, debug = debuggable build with readable JS logs in logcat; debug needs Metro via adb reverse)'
        type: choice
        options: [release, debug]
        default: release

# Least-privilege GITHUB_TOKEN: builds an APK and uploads it as an artifact —
# no repo writes. See security audit 2026-07 (broad-permissions hardening).
permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build debug-signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Bake the PRODUCTION relay into the bundle (hard testing rule: emulators
      # hit prod, never a local relay). Read by the Expo config at prebuild and
      # by bundleReleaseJsAndAssets during assembleRelease.
      EXPO_PUBLIC_SERVER_URL: https://aegislink.duckdns.org
      EXPO_PUBLIC_RELAY_URL: https://aegislink.duckdns.org
      EXPO_PUBLIC_TURN_URL: turn:aegislink.duckdns.org:3478
      # Mirror the production mailbox-mode flip (eas.json production profile) so
      # this test APK is a FAITHFUL production stand-in for the mandatory 2-device
      # validation. With both set, MAILBOX_ENABLED is true and 1:1 delivery rides
      # the embedded-Tor mailbox socket; drop these two to build a mailbox-OFF APK.
      EXPO_PUBLIC_ONION_URL: http://fhxnal5jmuuqsbtzz7avos4drhqmuy4c7ffd35gi3hw2uwbe5iqshfyd.onion
      EXPO_PUBLIC_MAILBOX_MODE: 'on'
      AEGIS_EXPO_GO: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Gradle dependency cache (the *.gradle files don't exist until prebuild,
      # so setup-java's built-in gradle cache can't key off them).
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: test-apk-gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: test-apk-gradle-

      - name: Install mobile dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # The gradle.properties Expo generates caps the daemon at -Xmx2048m, which
      # OOMs at :app:packageRelease (PackageAndroidArtifact$IncrementalSplitterRunnable)
      # for this heavy release build (R8 + Hermes + arm64-v8a/x86_64 + Tor/WebRTC
      # native libs). android/ is gitignored (regenerated here), so raise the heap
      # on the generated file — comfortably within the 7GB runner. See audit 2026-07.
      - name: Raise Gradle heap (avoid packageRelease OOM)
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          grep '^org.gradle.jvmargs=' android/gradle.properties

      - name: Assemble APK
        env:
          VARIANT: ${{ inputs.variant || 'release' }}
        run: |
          cd android
          if [ "$VARIANT" = "debug" ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi

      - name: Report APK info
        env:
          VARIANT: ${{ inputs.variant || 'release' }}
        run: |
          ls -lh android/app/build/outputs/apk/$VARIANT/*.apk
          echo "sha256:"; sha256sum android/app/build/outputs/apk/$VARIANT/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: aegislink-test-apk-${{ inputs.variant || 'release' }}
          path: mobile/android/app/build/outputs/apk/${{ inputs.variant || 'release' }}/*.apk
          if-no-files-found: error
