# ClusterFuzzLite — build fuzzers on every push to main and cache the result.
# The PR workflow (cflite_pr.yml, mode 'code-change') downloads this cached
# build to tell whether a crash it finds is new in the PR or pre-existing on
# main. No separate storage repo is required; the GitHub Actions cache is used.
name: ClusterFuzzLite continuous build
on:
  push:
    branches: [main]
permissions: read-all
jobs:
  # ── DISABLED pending an upstream OSS-Fuzz regression ──────────────────────
  # clusterfuzzlite build_fuzzers@v1 validates SANITIZER against
  # ['address','memory','undefined','coverage'] and rejects 'none' — yet the JS
  # build layer rejects address/memory/undefined ("JavaScript projects cannot
  # be fuzzed with sanitizers"). No value satisfies both layers, so cloud
  # fuzzing cannot build for a JavaScript project right now. Flip `if` back to
  # true once OSS-Fuzz restores 'none' for JS.
  Build:
    if: ${{ false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Semantically correct for a JS project (infra/oss-fuzz/project.yaml
        # declares sanitizers: [none]). Retained so re-enabling the job needs
        # no further edit once the upstream 'none' regression is resolved.
        sanitizer: [none]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: javascript
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
          upload-build: true
