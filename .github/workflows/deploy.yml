# Deploy relay to production — MANUAL ONLY (workflow_dispatch).
#
# Matches the real VM layout (verified over SSH 2026-06-11):
#   - code:    /home/ubuntu/aegislink/server   (no git checkout on the VM)
#   - service: systemd unit `aegislink` → node_modules/.bin/tsx src/index.ts
#   - env:     /home/ubuntu/aegislink/.env (EnvironmentFile — never touched here)
#   - nginx, coturn and the landing are managed separately
#     (infra/nginx/*, infra/deploy-web.sh, run manually over SSH)
#
# Required GitHub secrets:
#   DEPLOY_HOST     — public IP or hostname of the VM
#   DEPLOY_USER     — SSH user (ubuntu)
#   DEPLOY_SSH_KEY  — private key authorized on the VM (dedicated CI key)
#
# Safety: backs up the running code, restarts, health-checks against
# localhost, and rolls back automatically if /health does not come back.

name: Deploy relay (manual)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy relay via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Package server sources
        run: |
          tar -czf /tmp/aegislink-server-src.tar.gz \
            -C server src package.json package-lock.json tsconfig.json jest.config.cjs

      - name: Upload to VM
        run: |
          scp -i ~/.ssh/deploy_key /tmp/aegislink-server-src.tar.gz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/"

      - name: Deploy, restart, health-check (rollback on failure)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s << 'ENDSSH'
          set -euo pipefail
          APP=/home/ubuntu/aegislink/server
          STAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP=/home/ubuntu/aegislink/backup-$STAMP

          echo "==> Backing up running code to $BACKUP"
          mkdir -p "$BACKUP"
          cp -r "$APP/src" "$APP/package.json" "$APP/package-lock.json" "$BACKUP/"

          echo "==> Extracting new sources"
          tar -xzf /tmp/aegislink-server-src.tar.gz -C "$APP"
          rm -f /tmp/aegislink-server-src.tar.gz

          echo "==> Installing dependencies (prod only)"
          cd "$APP"
          npm ci --omit=dev --silent

          echo "==> Restarting systemd service"
          sudo systemctl restart aegislink

          echo "==> Health check (localhost, up to 60 s)"
          ok=0
          for i in $(seq 1 12); do
            sleep 5
            if curl -sf --max-time 5 http://127.0.0.1:3001/health | grep -q '"ok":true'; then
              ok=1; break
            fi
          done

          if [ "$ok" = "1" ]; then
            echo "==> Deploy OK"
            # Keep only the 3 most recent backups
            ls -dt /home/ubuntu/aegislink/backup-* 2>/dev/null | tail -n +4 | xargs -r rm -rf
          else
            echo "==> Health check FAILED — rolling back to $BACKUP"
            rm -rf "$APP/src"
            cp -r "$BACKUP/src" "$APP/src"
            cp "$BACKUP/package.json" "$BACKUP/package-lock.json" "$APP/"
            npm ci --omit=dev --silent
            sudo systemctl restart aegislink
            exit 1
          fi
          ENDSSH

      - name: Public health check
        run: |
          sleep 3
          curl -sf --max-time 10 https://aegislink.duckdns.org/health | grep -q '"ok":true'
          echo "Public HTTPS health check PASSED"
