# Build AAB — signed Android App Bundle for Google Play Console.
#
# Why this exists: the store-upload artifact must be a RELEASE-signed .aab (not the
# debug-signed test APK from test-apk.yml, nor the unsigned repro APK). Local Windows
# release builds are blocked (corrupt NDK 27.1 sysroot + MAX_PATH), so we bundle on a
# clean Ubuntu runner with gradle :app:bundleRelease and sign with the project upload
# key supplied entirely via GitHub Secrets — nothing sensitive is committed.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    — base64 of the upload keystore (base64 -w0 keystore)
#   ANDROID_KEYSTORE_PASSWORD  — store password
#   ANDROID_KEY_ALIAS          — key alias
#   ANDROID_KEY_PASSWORD       — key password
#
# The prebuilt android/app/build.gradle signs `release` with the debug keystore. This
# workflow patches that block to a release signingConfig that reads the credentials
# from the environment (System.getenv) at gradle-eval time — passwords never touch disk.
#
# Trigger: Actions tab → "Build AAB" → Run workflow, or `gh workflow run build-aab.yml`.
name: Build AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    name: Bundle signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Faithful production bundle — mirror eas.json `production` profile so the
      # store AAB behaves exactly like a real production install (prod relay + TURN,
      # onion mailbox, mailbox-mode on). Read at prebuild and by bundleReleaseJsAndAssets.
      APP_ENV: production
      EXPO_PUBLIC_SERVER_URL: https://aegislink.duckdns.org
      EXPO_PUBLIC_RELAY_URL: https://aegislink.duckdns.org
      EXPO_PUBLIC_TURN_URL: turn:aegislink.duckdns.org:3478
      EXPO_PUBLIC_ONION_URL: http://fhxnal5jmuuqsbtzz7avos4drhqmuy4c7ffd35gi3hw2uwbe5iqshfyd.onion
      EXPO_PUBLIC_MAILBOX_MODE: 'on'
      AEGIS_EXPO_GO: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # Gradle dependency cache (the *.gradle files don't exist until prebuild, so
      # setup-java's built-in gradle cache can't key off them). Content-addressed.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build-aab-gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: build-aab-gradle-

      - name: Install mobile dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # Expo's generated gradle.properties caps the daemon at -Xmx2048m, which OOMs
      # at release bundling/packaging (PackageAndroidArtifact$IncrementalSplitterRunnable)
      # for this heavy build (R8 + Hermes + Tor/WebRTC native libs). android/ is
      # gitignored (regenerated here), so raise the heap on the generated file —
      # within the 7GB runner. Same fix as test-apk.yml. See audit 2026-07.
      - name: Raise Gradle heap (avoid bundleRelease OOM)
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          grep '^org.gradle.jvmargs=' android/gradle.properties

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty — cannot sign the AAB."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
          echo "keystore bytes: $(stat -c %s android/app/upload.keystore)"

      - name: Inject release signing config
        run: |
          python3 - <<'PY'
          import io, re, sys
          p = "android/app/build.gradle"
          s = io.open(p, encoding="utf-8").read()

          # 1) Add a `release` signingConfig (reads creds from env at eval time) right
          #    after the generated `debug` signingConfig block inside `signingConfigs {`.
          debug_block = """        debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }"""
          # The template indents with 8 spaces; rebuild the marker with real indentation.
          marker = re.search(r"( *)debug \{\s*\n\s*storeFile file\('debug\.keystore'\)\s*\n\s*storePassword 'android'\s*\n\s*keyAlias 'androiddebugkey'\s*\n\s*keyPassword 'android'\s*\n( *)\}", s)
          if not marker:
              sys.exit("FATAL: could not locate the debug signingConfig block to anchor release signing")
          release_block = marker.group(0) + """
          release {
                  storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'upload.keystore')
                  storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  keyAlias System.getenv('ANDROID_KEY_ALIAS')
                  keyPassword System.getenv('ANDROID_KEY_PASSWORD')
              }"""
          s = s[:marker.start()] + release_block + s[marker.end():]

          # 2) Point the `release` buildType at signingConfigs.release. The generated
          #    line sits right after the RN "signed-apk-android" caution comment, which
          #    uniquely identifies the release buildType (debug uses the same text but
          #    without that comment above it).
          anchor = "// see https://reactnative.dev/docs/signed-apk-android.\n            signingConfig signingConfigs.debug"
          if anchor not in s:
              sys.exit("FATAL: could not locate the release buildType signingConfig line to repoint")
          s = s.replace(anchor, "// see https://reactnative.dev/docs/signed-apk-android.\n            signingConfig signingConfigs.release", 1)

          io.open(p, "w", encoding="utf-8").write(s)
          print("Release signing injected OK")
          PY
          echo "--- signingConfigs / release buildType after patch ---"
          sed -n '/signingConfigs {/,/^    }/p' android/app/build.gradle
          grep -n "signingConfig signingConfigs" android/app/build.gradle

      - name: Bundle release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:bundleRelease --no-daemon

      - name: Verify AAB is signed with the upload key
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "AAB: $AAB"
          ls -lh "$AAB"
          echo "sha256:"; sha256sum "$AAB"
          # jarsigner ships with the Temurin JDK — confirm the bundle carries a signature.
          jarsigner -verify -verbose:summary "$AAB" | tail -5

      - uses: actions/upload-artifact@v7
        with:
          name: aegislink-release-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
