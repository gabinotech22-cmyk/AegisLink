# ClusterFuzzLite — fuzz code changed in a pull request.
# Runs the Jazzer.js parser targets (mobile/fuzz/) against the diff so a newly
# introduced crash in an untrusted-input parser fails the PR.
name: ClusterFuzzLite PR fuzzing
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'infra/oss-fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_pr.yml'
permissions: read-all
jobs:
  PR:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Jazzer.js has no native C sanitizer. ClusterFuzzLite's build_fuzzers
        # action rejects address/memory/undefined for JavaScript projects
        # ("JavaScript projects cannot be fuzzed with sanitizers"); the only
        # valid value here is 'none'.
        sanitizer: [none]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: javascript
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
