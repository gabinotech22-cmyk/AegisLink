# ClusterFuzzLite — fuzz code changed in a pull request.
# Runs the Jazzer.js parser targets (mobile/fuzz/) against the diff so a newly
# introduced crash in an untrusted-input parser fails the PR.
name: ClusterFuzzLite PR fuzzing
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'infra/oss-fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_pr.yml'
permissions: read-all
jobs:
  # ── DISABLED pending an upstream OSS-Fuzz regression ──────────────────────
  # clusterfuzzlite build_fuzzers@v1 validates SANITIZER against
  # ['address','memory','undefined','coverage'] and rejects 'none' — yet the JS
  # build layer rejects address/memory/undefined ("JavaScript projects cannot
  # be fuzzed with sanitizers"). No value satisfies both layers, so cloud
  # fuzzing cannot build for a JavaScript project right now. The local Jest
  # fuzz job ("Mobile parser fuzz") still runs on every PR and carries the real
  # signal. Flip `if` back to true once OSS-Fuzz restores 'none' for JS.
  PR:
    if: ${{ false }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Semantically correct for a JS project (infra/oss-fuzz/project.yaml
        # declares sanitizers: [none]). Retained so re-enabling the job needs
        # no further edit once the upstream 'none' regression is resolved.
        sanitizer: [none]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: javascript
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
