# ClusterFuzzLite — scheduled batch fuzzing of all targets on the latest HEAD.
# Runs each Jazzer.js parser target for longer than the PR gate to grow the
# corpus and surface deeper bugs.
name: ClusterFuzzLite batch fuzzing
on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}
permissions: read-all
jobs:
  BatchFuzzing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # build_fuzzers@v1 rejects 'none' (valid: address/memory/undefined/
        # coverage). Jazzer.js/JS has no native sanitizer → label is a no-op;
        # use 'address', the ClusterFuzzLite default.
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: javascript
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          mode: 'batch'
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
