# CodeQL — semantic static analysis for JavaScript/TypeScript
#
# Free for public repos. Scans the whole tree (mobile/ + server/ + desktop/)
# with GitHub's security-and-quality query suite and uploads findings to the
# repo's Security → Code scanning tab. Runs on PRs to main, on push to main,
# and weekly so new advisories surface even without a code change.
#
# This is automated triage, NOT a substitute for a human crypto audit — it
# catches injection / unsafe-deserialization / taint-flow patterns, and gives
# OTF/OSTIF applicants concrete evidence that the project runs continuous SAST.
#
# NOTE: never add secrets, real IPs, or key material to this workflow.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Query suite (security-extended) and paths-ignore (generated/vendored
          # dirs) live in the config so they apply to every analysis run.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
