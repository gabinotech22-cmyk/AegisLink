# CodeQL — semantic static analysis for JavaScript/TypeScript
#
# Free for public repos. Scans the whole tree (mobile/ + server/ + desktop/)
# with GitHub's security-and-quality query suite and uploads findings to the
# repo's Security → Code scanning tab. Runs on PRs to main, on push to main,
# and weekly so new advisories surface even without a code change.
#
# This is automated triage, NOT a substitute for a human crypto audit — it
# catches injection / unsafe-deserialization / taint-flow patterns, and gives
# OTF/OSTIF applicants concrete evidence that the project runs continuous SAST.
#
# NOTE: never add secrets, real IPs, or key material to this workflow.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended = security queries only (no maintainability/style
          # noise). security-and-quality also flags unused vars / style across
          # the whole tree, which would fail the PR code-scanning gate on any
          # diff touching a file with pre-existing lint debt — not what a
          # security gate should do. Lint belongs to tsc/eslint, not CodeQL.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
