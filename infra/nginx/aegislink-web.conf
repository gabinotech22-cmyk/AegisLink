# AegisLink — public landing site (static)
# Canonical domain: aegis-link.it
# Other registered domains redirect to the canonical.
#
# Privacy: access_log is disabled — no client IPs or request patterns are stored.
#
# Deploy: copied to /etc/nginx/sites-available/aegislink-web on the VM by
# infra/deploy-web.sh. Requires a certificate covering all names:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d aegis-link.it -d www.aegis-link.it \
#     -d aegislink.online -d www.aegislink.online \
#     -d aegislink.store -d www.aegislink.store \
#     -d aegislinksrl.it -d www.aegislinksrl.it
#
# Until DNS + certs exist, deploy-web.sh installs the HTTP-only bootstrap
# block instead (same file with the 443 servers commented out is NOT used;
# the script generates the bootstrap inline).

server {
    listen 80;
    server_name aegis-link.it www.aegis-link.it
                aegislink.online www.aegislink.online
                aegislink.store www.aegislink.store
                aegislinksrl.it www.aegislinksrl.it;

    access_log off;

    # ACME http-01 challenges (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aegis-link.it$request_uri;
    }
}

# Non-canonical names → canonical
#
# NOTE: intentionally "listen 443 ssl" (no http2). nginx's HTTP/2 support is a
# property of the shared listening SOCKET (0.0.0.0:443), not of an individual
# server_name/SNI match — enabling http2 in ANY server block bound to this
# socket forces ALPN to offer/negotiate h2 for every hostname served on 443,
# including aegislink.duckdns.org (see aegislink.conf). iOS's native
# NSURLSession/WebSocket stack negotiates h2 by default and cannot perform a
# classic RFC6455 WebSocket Upgrade over it, which silently broke Socket.IO
# registration for every iOS build. Root-caused + fixed 2026-07-10.
server {
    listen 443 ssl;
    server_name www.aegis-link.it
                aegislink.online www.aegislink.online
                aegislink.store www.aegislink.store
                aegislinksrl.it www.aegislinksrl.it;

    ssl_certificate /etc/letsencrypt/live/aegis-link.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aegis-link.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log off;

    return 301 https://aegis-link.it$request_uri;
}

# Canonical landing
server {
    listen 443 ssl;
    server_name aegis-link.it;

    ssl_certificate /etc/letsencrypt/live/aegis-link.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aegis-link.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Privacy: do NOT log client IPs or access patterns
    access_log off;
    error_log /var/log/nginx/aegislink-web-error.log warn;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    root /var/www/aegislink-web;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # index.html: always revalidate so a deploy is visible immediately.
    # `expires` (not add_header) keeps the security headers above inherited.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Static assets: filenames are NOT fingerprinted, so keep the TTL short
    # (1 day). After expiry nginx revalidates cheaply via ETag/Last-Modified.
    location ~* \.(png|jpe?g|webp|avif|svg|ico|gif|mp4|webm|woff2?|ttf|css|js)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
