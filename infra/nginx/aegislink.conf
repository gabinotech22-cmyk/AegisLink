# AegisLink — nginx production config
# Domain: aegislink.duckdns.org
#
# Privacy: access_log is disabled — no client IPs or request patterns are stored.
# X-Real-IP is forwarded to the relay only; the relay middleware discards it.
#
# Deploy: this file is copied to /etc/nginx/sites-available/aegislink on the VM
# by the CI deploy-server job. nginx is reloaded after copy.

upstream aegis_relay {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name aegislink.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aegislink.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/aegislink.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aegislink.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Privacy: do NOT log client IPs or access patterns
    access_log off;
    error_log /var/log/nginx/aegislink-error.log warn;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    # WebSocket support — Socket.IO long-polling + upgrade
    location /socket.io/ {
        proxy_pass http://aegis_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Forwarded to relay only — relay middleware discards IPs, never logs them
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # REST API — all other routes
    location / {
        proxy_pass http://aegis_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Forwarded to relay only — relay middleware discards IPs, never logs them
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_buffering off;
        client_max_body_size 55M;
    }
}
