# AegisLink — nginx production config
# Domain: aegislink.duckdns.org
#
# Privacy: access_log is disabled — no client IPs or request patterns are stored.
# X-Real-IP is forwarded to the relay only; the relay middleware discards it.
#
# Deploy: this file is copied to /etc/nginx/sites-available/aegislink on the VM
# by the CI deploy-server job. nginx is reloaded after copy.

upstream aegis_relay {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name aegislink.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    # NOTE: intentionally NOT "listen 443 ssl http2". iOS's native networking
    # stack (NSURLSession/CFNetwork) offers ALPN "h2" by default for HTTPS
    # connections; with http2 enabled here, nginx negotiates h2 for EVERY
    # connection to this host, including the one the client later reuses for
    # the Socket.IO WebSocket. A classic RFC6455 WebSocket Upgrade cannot be
    # performed over an HTTP/2 stream (that needs RFC8441 Extended CONNECT,
    # which this proxy_pass config does not implement), so the upgrade just
    # hangs forever with no error — while plain fetch()/GET requests (no
    # Upgrade semantics) succeed fine over h2. This is exactly why iOS never
    # completed the socket.io handshake (perpetual "REGISTRAZIONE IDENTITÀ…")
    # while Android worked: Android's WebSocket stack does not force h2 ALPN
    # the same way. Root-caused 2026-07-10 via `openssl s_client -alpn h2,http/1.1`
    # showing the live server negotiates h2 by default. Forcing http/1.1 only
    # (dropping the http2 keyword) makes ALPN offer/accept http/1.1, so the
    # WebSocket Upgrade path works identically for every client.
    listen 443 ssl;
    server_name aegislink.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/aegislink.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aegislink.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Privacy: do NOT log client IPs or access patterns
    access_log off;
    error_log /var/log/nginx/aegislink-error.log warn;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    # WebSocket support — Socket.IO long-polling + upgrade
    location /socket.io/ {
        proxy_pass http://aegis_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Forwarded to relay only — relay middleware discards IPs, never logs them
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # ── Landing fallback ──────────────────────────────────────────────────────
    # The custom domains (aegis-link.it/.art/.shop) are not registered yet
    # (verified 2026-06-11: NXDOMAIN + RDAP "Object not found"), so the landing
    # is served from this domain's root in the meantime. Exact-match locations:
    # every other path still proxies to the relay below. Harmless to keep once
    # aegis-link.it goes live via infra/deploy-web.sh.
    location = / {
        root /var/www/aegislink-web;
        index index.html;
    }
    location = /index.html {
        root /var/www/aegislink-web;
        expires -1;
    }

    # REST API — all other routes
    location / {
        proxy_pass http://aegis_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Forwarded to relay only — relay middleware discards IPs, never logs them
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_buffering off;
        client_max_body_size 55M;
    }
}

# ── ntfy clearnet (Fase 4 · Slice 2b.3 — UnifiedPush distributor access) ────
# UnifiedPush distributors (ntfy app, Sunup) cannot speak SOCKS/Tor, so the
# self-hosted ntfy needs a plain HTTPS door for the app-killed wake path.
# The in-app (app-alive) subscription of 2b.2 keeps using the onion; this
# port exists ONLY for external distributor daemons.
#
# Privacy invariants (docs/FASE4-SLICE2B-PUSH-DESIGN.md §5, R2):
#   - access_log off: no IPs, no topics, no timing persisted here.
#   - No X-Real-IP / X-Forwarded-For headers are sent upstream: ntfy runs with
#     behind-proxy=false and only ever sees nginx's loopback address.
#   - Topics are 128-bit epoch-rotating bearer capabilities; the URL path is
#     the only "secret" and it is never logged.
# Requires: port 8443 open in the VM firewall; ntfy published on 127.0.0.1:8090
# (docker-compose.yml).
server {
    listen 8443 ssl;
    server_name aegislink.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/aegislink.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aegislink.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log off;
    error_log /var/log/nginx/aegislink-error.log warn;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # WebSocket upgrade — ntfy subscribers may use /ws (JSON stream uses
        # plain long-lived HTTP; both need buffering off + long timeouts).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Deliberately NO X-Real-IP / X-Forwarded-For: zero client-IP exposure.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        # Wake payloads are empty/small; anything big here is abuse.
        client_max_body_size 16k;
    }
}
