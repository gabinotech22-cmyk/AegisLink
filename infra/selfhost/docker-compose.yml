# AegisLink — self-hosted relay (federation F6, docs/SELF-HOSTING.md)
#
# The smallest relay that can be someone's home: relay + Tor onion service +
# ntfy wake-up. Onion-only by design (docs/FEDERATION-DESIGN.md D1): there is
# no clearnet listener, no TLS, no certificate, no domain — clients reach it
# only through Tor, so this box never learns a user's IP and nothing about it
# needs to be public except the .onion address.
#
#   cp .env.example .env      # then fill BLOB_SECRET / TURN_SECRET (see there)
#   docker compose up -d --build
#   ./print-onion.sh          # → http://<56 chars>.onion  (persisted in tor_keys)
#
# Users point the app at that onion in Privacy → Network → "My relay".
# Calls: optional — see the coturn section at the bottom.
#
# Privacy guarantees enforced at this layer (same as the official deployment):
#   - relay: access logs omit IPs (middleware in app code + log driver cap);
#   - tor: log level notice, no per-connection data; onion-client IPs are
#     invisible by protocol design (rendezvous);
#   - ntfy: warn-only logs, short cache, never on clearnet;
#   - log rotation capped at 10 MB × 3 files.

services:
  # ── Relay (Node.js + Socket.IO) ──────────────────────────────────────────
  relay:
    build:
      context: ../../server
      dockerfile: Dockerfile
    image: aegislink-relay:selfhost
    container_name: aegislink-relay
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      AEGIS_DB_PATH: /data/aegislink.db
      # Behind tor only: no reverse proxy hops to trust.
      TRUST_PROXY: "0"
      # Fail closed: no browser origins. The desktop/mobile clients are not
      # browsers; an empty allowlist keeps CORS shut (golden rule #6).
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Human-readable name shown by the app's "Verify relay" (GET /relay/info).
      RELAY_NAME: ${RELAY_NAME:-My AegisLink relay}
      # BLOB_SECRET signs the download tokens of E2EE attachments; the relay
      # refuses to start in production without it. TURN_SECRET signs the
      # ephemeral TURN credentials (only used when you run coturn, but the
      # relay expects it to exist). Both are generated by ./up.sh if missing.
      BLOB_SECRET: ${BLOB_SECRET:?run ./up.sh or set BLOB_SECRET in .env}
      TURN_SECRET: ${TURN_SECRET:?run ./up.sh or set TURN_SECRET in .env}
      # Optional coturn (calls through NAT). Leave empty to skip: calls then try
      # a direct/STUN path only. See docs/SELF-HOSTING.md §Calls.
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURNS_PORT: ${TURNS_PORT:-}
      # Mailbox wake-up push through the co-hosted ntfy (Slice 2b). ON: this is
      # how a user's phone learns there is mail while the app is closed.
      PUSH_MAILBOX_ENABLED: ${PUSH_MAILBOX_ENABLED:-on}
      NTFY_URL: http://ntfy:80
      # iOS app-killed wake via Expo/APNs token binding — a documented privacy
      # reduct, opt-in, and it needs Apple credentials you most likely do not
      # have. Keep off unless you know why you want it.
      PUSH_MAILBOX_TOKEN_WAKE: ${PUSH_MAILBOX_TOKEN_WAKE:-off}
      # Federation F6: charge a small proof-of-work per submitted envelope.
      # Turn on if your relay gets spammed; real clients solve it in ms.
      MAILBOX_SUBMIT_POW: ${MAILBOX_SUBMIT_POW:-off}
      # Directory lookups (GET /identity/:id). 'off' keeps your users' ids
      # private: contacts then come only from links/QRs (which carry the key).
      IDENTITY_LOOKUP: ${IDENTITY_LOOKUP:-on}
      # Public channels are a relay-local feature; off by default here.
      PUBLIC_CHANNELS: ${PUBLIC_CHANNELS:-off}
      # No third-party push (FCM/APNs) on a self-hosted relay: the Tor mailbox
      # wake (ntfy) covers Android; iOS killed-app wake needs Apple credentials.
      FCM_SERVER_KEY: ""
      APNS_KEY_ID: ""
      APNS_TEAM_ID: ""
      APNS_KEY_P8: ""
    volumes:
      - relay_data:/data
      - relay_uploads:/app/uploads
    # No `ports:` on purpose — reachable ONLY through the tor sidecar.
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aegis_internal

  # ── Tor onion service (the relay's only door) ────────────────────────────
  # Same image as the official deployment (infra/tor) but with the
  # LOCATION-HIDDEN torrc (torrc.selfhost): full 3-hop service side, so the
  # Tor network never learns this machine's IP. The official relay runs
  # single-onion mode because its location is public anyway; yours is not.
  # ONION_TORRC=torrc in .env opts back into that mode (see .env.example).
  # v3 onion, virtual port 80 → relay:3001, 8090 → ntfy:80. The onion identity
  # key lives ONLY in tor_keys — back it up: losing it changes your address
  # and every user has to re-point the app.
  tor:
    build:
      context: ../tor
      dockerfile: Dockerfile
      args:
        TORRC: ${ONION_TORRC:-torrc.selfhost}
    image: aegislink-tor:selfhost
    container_name: aegislink-tor
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    volumes:
      - tor_keys:/var/lib/tor
    networks:
      - aegis_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── ntfy (mailbox wake-up) ───────────────────────────────────────────────
  # Publish stays relay-internal; clients subscribe over the onion (port 8090).
  # Never exposed on clearnet.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: aegislink-ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BEHIND_PROXY: "false"
      NTFY_VISITOR_SUBSCRIPTION_LIMIT: "5000"
      NTFY_VISITOR_REQUEST_LIMIT_BURST: "500"
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: "1s"
      NTFY_CACHE_DURATION: "12h"
      NTFY_LOG_LEVEL: warn
    expose:
      - "80"
    networks:
      - aegis_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── coturn (optional, calls through NAT) ─────────────────────────────────
  # Media cannot ride Tor (UDP, latency). If you want reliable calls for your
  # users, run coturn on a host with a PUBLIC IP and set TURN_HOST / TURN_SECRET
  # accordingly: infra/coturn/docker-compose.coturn.yml is the reference
  # deployment (same TURN_SECRET on both sides). Without it, calls between two
  # users behind restrictive NATs will fail; chat is unaffected.

volumes:
  relay_data:
    driver: local
  relay_uploads:
    driver: local
  tor_keys:
    driver: local

networks:
  aegis_internal:
    driver: bridge
