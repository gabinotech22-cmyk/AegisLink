# ── AegisLink coturn — production configuration ──────────────────────────────
#
# Privacy invariants (AegisLink zero-metadata policy):
#   - No client IP logging: verbose and log-file directives are absent
#   - no-cli: management interface disabled entirely
#   - Ephemeral credentials only: use-auth-secret + static-auth-secret
#     Tokens are generated server-side with TTL up to max-allocate-lifetime (600 s)
#   - no-loopback-peers, no-multicast-peers + denied-peer-ip: prevent SSRF
#
# This file contains ${TURN_SECRET} and ${EXTERNAL_IP} as literal placeholders.
# infra/deploy.sh runs envsubst to expand them before writing to /etc/turnserver.conf.
# The literal strings MUST remain unexpanded in this repo file.

# ── Network ────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# Bind to all interfaces
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Server's public IP — coturn embeds this in ICE candidates.
# Expanded at deploy time by envsubst.
external-ip=${EXTERNAL_IP}

# ── UDP media relay port range ──────────────────────────────────────────────
# These ports MUST be open in the AWS/cloud Security Group (UDP ingress).
min-port=49152
max-port=65535

# ── TLS ────────────────────────────────────────────────────────────────────
# Let's Encrypt cert managed by certbot.
# A deploy hook at /etc/letsencrypt/renewal-hooks/deploy/coturn-perms.sh
# restores group read on privkey after renewal and reloads coturn.
cert=/etc/letsencrypt/live/aegislink.duckdns.org/fullchain.pem
pkey=/etc/letsencrypt/live/aegislink.duckdns.org/privkey.pem

# ── Authentication ─────────────────────────────────────────────────────────
# HMAC-SHA1 time-limited tokens.
# The static-auth-secret is injected at deploy time and never stored in this repo.
fingerprint
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=aegislink.duckdns.org

# ── Security ───────────────────────────────────────────────────────────────
# Block loopback and RFC1918 destinations to prevent SSRF / AWS metadata abuse
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Disable the management CLI entirely — no way to query active sessions
no-cli

# ── Quotas ─────────────────────────────────────────────────────────────────
# Maximum simultaneous sessions (aggregate — no per-user tracking)
total-quota=200

# No per-allocation bandwidth cap (0 = unlimited)
bps-capacity=0

# Nonce lifetime in seconds — limits credential replay window
stale-nonce=600

# Maximum allocation lifetime in seconds (ephemeral — short window)
max-allocate-lifetime=600

# ── Logging ────────────────────────────────────────────────────────────────
# Do NOT enable verbose or log-file — that would record per-session metadata.
# coturn defaults to syslog at WARNING level: logs errors only, not IPs.
no-stdout-log
syslog
