# ── AegisLink coturn — production configuration ──────────────────────────────
#
# Privacy invariants (AegisLink zero-metadata policy):
#   - No client IP logging: verbose and log-file directives are absent
#   - no-cli: management interface disabled entirely
#   - Ephemeral credentials only: use-auth-secret + static-auth-secret
#     Tokens are generated server-side with TTL 86400 s (24 h max)
#   - no-loopback-peers, no-multicast-peers: prevent SSRF / local network abuse
#
# This file is processed by infra/deploy.sh which runs envsubst to expand
# the TURN_SECRET placeholder before writing to the container mount point.
# The literal string "${TURN_SECRET}" below MUST remain unexpanded in this file.

# ── Network ────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# Bind to all interfaces; Docker host networking exposes the correct public IP
listening-ip=0.0.0.0

# Set to the server's public IP so coturn embeds it in XOR-MAPPED-ADDRESS.
# Overridden at deploy time via envsubst if EXTERNAL_IP is set.
# external-ip=${EXTERNAL_IP}

# ── TLS ────────────────────────────────────────────────────────────────────
cert=/etc/ssl/aegislink/fullchain.pem
pkey=/etc/ssl/aegislink/privkey.pem

# ── Authentication ─────────────────────────────────────────────────────────
# HMAC-SHA1 time-limited tokens — the static-auth-secret is injected at
# deploy time and never stored in this repo.
fingerprint
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=aegislink.duckdns.org

# ── Quotas ─────────────────────────────────────────────────────────────────
# Maximum simultaneous sessions (aggregate, not per-user — no user tracking)
total-quota=200

# No per-allocation bandwidth cap (0 = unlimited); adjust if costs are a concern
bps-capacity=0

# Nonce lifetime in seconds — short to limit credential replay window
stale-nonce=600

# ── Security ───────────────────────────────────────────────────────────────
# Block loopback and multicast destinations to prevent SSRF
no-loopback-peers
no-multicast-peers

# Disable the management CLI entirely — no way to query active sessions
no-cli

# Allow only the TURN protocol (disable plain STUN for unauthenticated probing)
# Comment out if you need public STUN for compatibility
# no-stun

# Restrict relay to UDP and TCP (disable DTLS if not needed)
# no-dtls

# ── Logging ────────────────────────────────────────────────────────────────
# Do NOT enable verbose or log-file — that would record per-session metadata.
# coturn defaults to syslog at WARNING level which logs only errors, not IPs.
# Explicitly suppress any connection-level detail:
no-stdout-log
syslog

# Minimum log level: only warnings and above (no INFO = no per-peer lines)
# Note: coturn uses its own log level scale (0=silent … 7=debug)
# Level 1 = only errors; level 2 = errors + warnings (recommended)
# Uncomment and set via environment if needed:
# log-level=1
