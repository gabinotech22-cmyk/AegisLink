# ── AegisLink coturn — production configuration ──────────────────────────────
#
# Privacy invariants (AegisLink zero-metadata policy):
#   - No client IP logging: verbose and log-file directives are absent
#   - no-cli: management interface disabled entirely
#   - Ephemeral credentials only: use-auth-secret + static-auth-secret
#     Tokens are generated server-side with TTL up to max-allocate-lifetime (600 s)
#   - no-loopback-peers, no-multicast-peers + denied-peer-ip: prevent SSRF
#
# This file contains ${TURN_SECRET} and ${EXTERNAL_IP} as literal placeholders.
# infra/coturn/deploy-coturn.sh runs envsubst to expand them before writing to
# /etc/coturn/turnserver.conf. The literal strings MUST remain unexpanded here.
#
# coturn runs on its OWN VM (see docs/COTURN-VM-RUNBOOK.md). It is deliberately
# NOT part of the relay's docker-compose.yml: call media is bursty, bandwidth
# heavy and unpredictable, and must not compete with the relay/Tor/ntfy for the
# chat path's availability. The relay only needs to SIGN credentials with the
# same TURN_SECRET; it never talks to coturn directly.

# ── Network ────────────────────────────────────────────────────────────────
listening-port=3478

# NOTE: the TLS listener (tls-listening-port / cert / pkey) is NOT declared here.
# deploy-coturn.sh appends it only when a readable cert+key pair actually exists
# for TURN_REALM_HOST. Declaring it unconditionally is what the relay VM did, and
# coturn silently failed to open 5349 (unreadable privkey) while the config
# claimed TLS was on — a lie that made TURNS_PORT unusable. Fail visibly instead:
# no cert -> no TLS block -> the relay leaves TURNS_PORT empty and advertises
# only turn:/stun: on 3478, which is exactly what production already serves.

# Bind to all interfaces
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Server's public IP — coturn embeds this in ICE candidates.
# Expanded at deploy time by envsubst.
external-ip=${EXTERNAL_IP}

# ── UDP media relay port range ──────────────────────────────────────────────
# These ports MUST be open in the AWS/cloud Security Group (UDP ingress).
min-port=49152
max-port=65535

# ── Authentication ─────────────────────────────────────────────────────────
# HMAC-SHA1 time-limited tokens.
# The static-auth-secret is injected at deploy time and never stored in this repo.
# It MUST be byte-identical to the TURN_SECRET the relay signs with
# (server/src/routes/turn.ts) — coturn verifies the HMAC the relay produced.
fingerprint
use-auth-secret
static-auth-secret=${TURN_SECRET}

# realm is an OPAQUE string in the use-auth-secret (TURN REST) mechanism: it is
# echoed in the challenge but takes no part in deriving the credential, which is
# HMAC-SHA1(TURN_SECRET, username). It therefore deliberately does NOT track the
# host coturn runs on — keeping it stable across the move to a dedicated VM means
# zero change to how any existing client computes credentials.
realm=aegislink.duckdns.org

# ── Security ───────────────────────────────────────────────────────────────
# Block loopback, RFC1918, link-local and cloud-metadata destinations to prevent
# an authenticated TURN client from relaying toward internal services / SSRF.
# NOTE: link-local 169.254.0.0/16 hosts the cloud metadata endpoint
# (169.254.169.254 on AWS/GCP/Hetzner) — omitting it makes the "prevent metadata
# abuse" comment a lie, so it is explicitly denied here. See security audit 2026-07.
# NOTE: `no-loopback-peers` USED to be here. coturn 4.16 rejects it outright
# ("WARNING: Bad configuration format: no-loopback-peers") — the option no
# longer exists, so the loopback protection it was supposed to give was NEVER
# applied. It is replaced below by an explicit denied-peer-ip range, which the
# startup log confirms with a matching "Black listing: 127.0.0.0-..." line.
# Verify after any coturn upgrade: an unknown option is a WARNING, not a fatal
# error, so a silently-dropped directive looks exactly like a working one.
no-multicast-peers
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
# IPv6 internal ranges: loopback (::1), unique-local (fc00::/7) and link-local
# (fe80::/10). ::1 is listed explicitly — nothing else covers it now that
# no-loopback-peers turned out to be a no-op (see note above).
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Disable the management CLI entirely — no way to query active sessions.
# coturn 4.16 logs "ERROR: no-cli option is deprecated, see --cli" on startup.
# It still parses (unlike no-loopback-peers, which is rejected as bad format),
# but the wording is a warning that it may be dropped in a future release. If a
# coturn upgrade ever turns this into a rejected option the CLI would come back
# ON silently — re-check the startup log after upgrading and switch to the
# replacement directive then.
no-cli

# ── Quotas ─────────────────────────────────────────────────────────────────
# Maximum simultaneous sessions (aggregate — no per-user tracking)
total-quota=200

# No per-allocation bandwidth cap (0 = unlimited)
bps-capacity=0

# Nonce lifetime in seconds — limits credential replay window
stale-nonce=600

# Maximum allocation lifetime in seconds (ephemeral — short window)
max-allocate-lifetime=600

# ── Logging ────────────────────────────────────────────────────────────────
# Do NOT enable verbose or log-file — that would record per-session metadata.
# coturn defaults to syslog at WARNING level: logs errors only, not IPs.
no-stdout-log
syslog
